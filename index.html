<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B7A75">
<title>Belajar Inggris</title>
<style>
:root{
  --paper:#E8EEF2;--panel:#F8FBFC;--well:#DAE5EA;--ink:#10243A;--ink2:#4A6074;--line:#C2D0D8;
  --signal:#0B7A75;--signal-ink:#FFFFFF;--lamp:#E9A21B;--lampbg:#FBEBC8;
  --ok:#2B8A57;--okbg:#D9F0E3;--bad:#C0412E;--badbg:#F7DAD4;
  --serif:Georgia,"Noto Serif","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --c-vocab:#0B7A75;--c-vocab-rgb:11,122,117;
  --c-fill:#C2610F;--c-fill-rgb:194,97,15;
  --c-gram:#3659B8;--c-gram-rgb:54,89,184;
  --c-read:#A8386E;--c-read-rgb:168,56,110;
  --c-cloze:#6C47B8;--c-cloze-rgb:108,71,184;
  --c-listen:#1F8A5A;--c-listen-rgb:31,138,90;
  --c-cap:#C0412E;--c-cap-rgb:192,65,46;
  --c-saved:#8A6A00;--c-saved-rgb:138,106,0;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 8px 16px -12px rgba(16,36,58,.45);
}
:root[data-theme="dark"]{
  --paper:#0C1721;--panel:#13222E;--well:#0E1B25;--ink:#E6EEF3;--ink2:#9CB1BF;--line:#29404F;
  --signal:#3FB8B0;--signal-ink:#06201F;--lamp:#F2B53A;--lampbg:#3A2E12;
  --ok:#4CC184;--okbg:#12331F;--bad:#F0705C;--badbg:#3B1A15;
  --c-vocab:#4CC9C0;--c-vocab-rgb:76,201,192;--c-fill:#F0A04B;--c-fill-rgb:240,160,75;
  --c-gram:#8BA6F2;--c-gram-rgb:139,166,242;--c-read:#EE82B0;--c-read-rgb:238,130,176;
  --c-cloze:#B49CF2;--c-cloze-rgb:180,156,242;--c-listen:#55D49A;--c-listen-rgb:85,212,154;
  --c-cap:#F58A74;--c-cap-rgb:245,138,116;--c-saved:#F2C94C;--c-saved-rgb:242,201,76;
  --shadow:0 8px 16px -12px rgba(0,0,0,.8);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0C1721;--panel:#13222E;--well:#0E1B25;--ink:#E6EEF3;--ink2:#9CB1BF;--line:#29404F;
    --signal:#3FB8B0;--signal-ink:#06201F;--lamp:#F2B53A;--lampbg:#3A2E12;
    --ok:#4CC184;--okbg:#12331F;--bad:#F0705C;--badbg:#3B1A15;
    --c-vocab:#4CC9C0;--c-vocab-rgb:76,201,192;--c-fill:#F0A04B;--c-fill-rgb:240,160,75;
    --c-gram:#8BA6F2;--c-gram-rgb:139,166,242;--c-read:#EE82B0;--c-read-rgb:238,130,176;
    --c-cloze:#B49CF2;--c-cloze-rgb:180,156,242;--c-listen:#55D49A;--c-listen-rgb:85,212,154;
    --c-cap:#F58A74;--c-cap-rgb:245,138,116;--c-saved:#F2C94C;--c-saved-rgb:242,201,76;
    --shadow:0 8px 16px -12px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line)}
header.top h1{margin:0;font-size:1.08rem;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;padding:0}
#back[hidden]{display:none}
#lvchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px 6px 10px;font-size:.84rem;font-weight:700;display:flex;gap:7px;align-items:center}
#lvchip i{width:9px;height:9px;border-radius:50%;background:var(--signal)}
main{flex:1;padding:16px 14px 110px}
h2{font-size:1.25rem;margin:0 0 6px;letter-spacing:-.015em;line-height:1.25}
h3{font-size:.98rem;margin:20px 0 8px;font-weight:800}
p{margin:0 0 10px}
.muted{color:var(--ink2)}
.small{font-size:.86rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between;flex-wrap:nowrap}
.stack>*+*{margin-top:10px}
svg.i{display:block}

/* ---------- hero ---------- */
.hero2{position:relative;border-radius:16px;padding:16px;margin-bottom:18px;color:#EAF4F8;background:linear-gradient(140deg,#0E2A40 0%,#14485F 100%);overflow:hidden;box-shadow:0 14px 28px -18px rgba(8,30,48,.9)}
.hero2::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:20px 20px;pointer-events:none}
.hero2>*{position:relative}
.strip{display:flex;gap:7px;margin-bottom:14px}
.strip i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2)}
.strip i.on{background:#F2B53A;border-color:#F2B53A;box-shadow:0 0 9px 2px rgba(242,181,58,.7)}
.strip i.ok{background:#4CD08A;border-color:#4CD08A;box-shadow:0 0 9px 2px rgba(76,208,138,.7)}
.hrow{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:rgba(255,255,255,.16)}
.ring .pr{stroke:#F2B53A;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring .num b{font-size:1.6rem;font-weight:800}
.ring .num span{font-size:.72rem;opacity:.8}
.hero2 h2{font-size:1.7rem;font-weight:800;margin:0 0 4px;color:#fff}
.hero2 p{color:#BFD6E2;margin:0 0 10px;font-size:.95rem}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-size:.82rem;font-weight:700}
.pill svg{color:#F2B53A}
.hbtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hbtns .btn{flex:1;min-width:140px}
.btn.gold{background:#F2B53A;color:#231800;border-color:#F2B53A}
.btn.glass{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.28)}

/* ---------- tiles ---------- */
.panel{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{position:relative;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:13px 13px 12px;min-height:150px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.tile:active{transform:scale(.985)}
.a-vocab{--acc:var(--c-vocab);--acc-rgb:var(--c-vocab-rgb)}
.a-fill{--acc:var(--c-fill);--acc-rgb:var(--c-fill-rgb)}
.a-gram{--acc:var(--c-gram);--acc-rgb:var(--c-gram-rgb)}
.a-read{--acc:var(--c-read);--acc-rgb:var(--c-read-rgb)}
.a-cloze{--acc:var(--c-cloze);--acc-rgb:var(--c-cloze-rgb)}
.a-listen{--acc:var(--c-listen);--acc-rgb:var(--c-listen-rgb)}
.a-cap{--acc:var(--c-cap);--acc-rgb:var(--c-cap-rgb)}
.a-saved{--acc:var(--c-saved);--acc-rgb:var(--c-saved-rgb)}
.tile .ti{width:40px;height:40px;border-radius:12px;background:rgba(var(--acc-rgb),.15);color:var(--acc);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.tile .lamp{position:absolute;right:12px;top:12px;width:11px;height:11px;border-radius:50%;background:var(--well);border:1px solid var(--line)}
.tile.on .lamp{background:var(--lamp);border-color:var(--lamp);box-shadow:0 0 9px 2px var(--lamp)}
.tile.ok .lamp{background:var(--ok);border-color:var(--ok);box-shadow:0 0 9px 2px var(--ok)}
.tile b{font-size:1.04rem;letter-spacing:-.01em}
.tile .d{font-size:.8rem;color:var(--ink2);line-height:1.32}
.tile .prog{height:5px;border-radius:3px;background:var(--well);overflow:hidden;margin-top:auto}
.tile .prog i{display:block;height:100%;background:var(--acc);border-radius:3px}
.tile .st{margin-top:6px;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2)}

/* ---------- buttons, chips ---------- */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 16px;font-weight:700;min-height:46px;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.9rem;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.icon{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0;font-size:1.2rem}
.icon.sm{width:38px;height:38px;border-radius:11px;font-size:1rem}
.icon.on{background:var(--lampbg);border-color:var(--lamp);color:var(--lamp)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:.9rem;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}

/* ---------- list items ---------- */
.item{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:13px 14px;display:flex;gap:12px;align-items:center;width:100%;text-align:left;box-shadow:var(--shadow)}
.item:active{transform:scale(.99)}
.item .grow{flex:1;min-width:0}
.item b{display:block}
.badge{display:inline-block;font-size:.74rem;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--well);color:var(--ink2);white-space:nowrap}
.badge.l1{background:#D7EEE2;color:#1D6B43}.badge.l2{background:#D8E8F7;color:#1F5A94}.badge.l3{background:#F3E6C9;color:#865B06}.badge.l4{background:#EFD9D4;color:#8F3425}
.badge.l5{background:#E5DCF6;color:#4B2E96}
.badge.gold{background:var(--lampbg);color:var(--lamp)}
:root[data-theme="dark"] .badge.l5,:root[data-theme="dark"] .badge.l1,:root[data-theme="dark"] .badge.l2,:root[data-theme="dark"] .badge.l3,:root[data-theme="dark"] .badge.l4{background:var(--well);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.l5,:root:not([data-theme="light"]) .badge.l1,:root:not([data-theme="light"]) .badge.l2,:root:not([data-theme="light"]) .badge.l3,:root:not([data-theme="light"]) .badge.l4{background:var(--well);color:var(--ink)}}
.lvh{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font-weight:800}
.lvh i{width:10px;height:10px;border-radius:3px;background:var(--signal)}
.lvh.l1 i{background:#2B8A57}.lvh.l2 i{background:#2F6FA3}.lvh.l3 i{background:#C98F00}.lvh.l4 i{background:#C0412E}
.lvh small{font-weight:600;color:var(--ink2)}

/* ---------- quiz ---------- */
.seg{display:flex;gap:3px;margin-bottom:12px}
.seg i{flex:1;height:6px;border-radius:3px;background:var(--well)}
.seg i.d{background:var(--signal)}.seg i.c{background:var(--ok)}.seg i.w{background:var(--bad)}.seg i.now{background:var(--ink2)}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.combo{display:inline-flex;gap:6px;align-items:center;font-size:.82rem;font-weight:800;color:var(--lamp);background:var(--lampbg);border-radius:999px;padding:3px 10px}
.q{font-size:1.22rem;line-height:1.45;margin:6px 0 14px;font-weight:700}
.en{font-family:var(--serif)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 14px;margin-bottom:9px;font-size:1.02rem;min-height:56px;box-shadow:var(--shadow)}
.opt .lt{flex:none;width:30px;height:30px;border-radius:9px;background:var(--well);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;color:var(--ink2)}
.opt .ot{flex:1;min-width:0}
.opt:not([disabled]):active{transform:scale(.99)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.right .lt{background:var(--ok);color:#fff}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt.wrong .lt{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;border:1px solid var(--ok);background:var(--okbg);padding:11px 13px;margin:12px 0}
.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb b.t{display:block;font-size:1.02rem;margin-bottom:2px}
.dock{position:sticky;bottom:0;padding:12px 0 14px;margin-top:6px;background:linear-gradient(to bottom,transparent,var(--paper) 28%)}
.hint{color:var(--ink2);font-size:.95rem;margin:-6px 0 12px}
.rs{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.rs .ring{width:112px;height:112px}
.rs .ring .tr{stroke:var(--well)}
.rs .ring .pr{stroke:var(--signal)}
.rs .ring .num{color:var(--ink)}
.score{font-size:2.6rem;font-weight:800;letter-spacing:-.02em}
.conf{position:fixed;top:-14px;width:9px;height:13px;z-index:50;pointer-events:none;border-radius:2px}

/* ---------- reading ---------- */
.read{font-family:var(--serif);font-size:1.14rem;line-height:1.85;max-width:62ch}
.read p{margin:0 0 1em}
.w{cursor:pointer;border-radius:4px}
.w:hover{background:var(--well)}
.w.k{border-bottom:1.5px dotted var(--signal)}
.box{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.formula{font-family:var(--serif);font-size:1.06rem;margin:6px 0 0;padding-left:1.1rem}
.formula li{margin:4px 0}
.ex{border-left:4px solid var(--c-gram);padding:4px 0 4px 12px;margin:10px 0}
.ex .en{font-size:1.08rem}
.tip{border-radius:12px;background:var(--lampbg);padding:11px 13px;margin-top:14px;font-size:.95rem;border:1px solid var(--lamp)}

/* ---------- flashcard ---------- */
.fc{width:100%;min-height:260px;border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:22px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow);cursor:pointer}
.fc .big{font-family:var(--serif);font-size:2.4rem;font-weight:700;letter-spacing:-.01em}
.fc .mean{font-size:1.4rem;font-weight:800;color:var(--signal)}
.fc .exs{font-family:var(--serif);font-size:1.06rem}
.meter{height:8px;background:var(--well);border-radius:4px;overflow:hidden;margin:8px 0 12px}
.meter i{display:block;height:100%;background:var(--signal);border-radius:4px}

/* ---------- cloze ---------- */
.cloze{font-family:var(--serif);font-size:1.16rem;line-height:2.4}
.blank{display:inline-block;min-width:5.2em;height:1.75em;line-height:1.75em;vertical-align:baseline;text-align:center;border:0;border-bottom:2px solid var(--ink2);background:rgba(var(--c-cloze-rgb),.12);border-radius:7px 7px 3px 3px;padding:0 .5em;margin:0 2px;font-family:var(--sans);font-size:.94rem;font-weight:700;color:var(--ink)}
.blank.g{min-width:4.2em}
.blank.active{border-bottom-color:var(--c-cloze);box-shadow:0 0 0 2px var(--c-cloze)}
.blank.right{background:var(--okbg);border-bottom-color:var(--ok)}
.blank.wrong{background:var(--badbg);border-bottom-color:var(--bad)}
input.blank{width:7em;color:var(--ink)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.bank .chip{background:var(--panel);font-size:.95rem}
.bank .chip[disabled]{opacity:.3}
.pop{position:absolute;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);padding:6px;display:flex;flex-direction:column;min-width:140px;max-width:84vw}
.pop button{border:0;background:transparent;text-align:left;padding:11px 14px;border-radius:9px;font-size:1.02rem;font-weight:700;min-height:44px}
.pop button:hover,.pop button.sel{background:var(--well)}
.kind{display:inline-flex;gap:6px;align-items:center;font-size:.78rem;font-weight:800;padding:2px 9px;border-radius:999px}
.kind.v{background:rgba(var(--c-cloze-rgb),.14);color:var(--c-cloze)}
.kind.g{background:rgba(var(--c-gram-rgb),.14);color:var(--c-gram)}

/* ---------- caption ---------- */
.scene{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.scene svg{display:block;width:100%;height:auto}
textarea.cap{width:100%;min-height:124px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);padding:13px;font-family:var(--serif);font-size:1.12rem;line-height:1.55;resize:vertical}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.chk li:last-child{border:0}
.chk .m{flex:none;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:800;color:#fff}
.chk .m.y{background:var(--ok)}.chk .m.n{background:var(--bad)}.chk .m.t{background:var(--lamp);color:#222}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid2 .scene{cursor:pointer}
.grid2 .cp{padding:9px 11px;font-size:.92rem}

/* ---------- dictation ---------- */
.dw{display:inline-block;padding:1px 7px;margin:2px 0;border-radius:6px;font-family:var(--serif);font-size:1.08rem}
.dw.ok{background:var(--okbg)}
.dw.miss{background:var(--badbg);text-decoration:underline wavy var(--bad)}
.dw.extra{background:var(--lampbg)}
input.txt{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--panel);font-size:1.05rem}

/* ---------- sheet + toast ---------- */
#shade{position:fixed;inset:0;background:rgba(8,18,28,.5);z-index:20;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:720px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:18px 16px 24px;display:none;box-shadow:0 -10px 34px rgba(0,0,0,.3)}
#sheet.open,#shade.open{display:block}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:60;display:none;max-width:90vw}
.sheet-w{font-family:var(--serif);font-size:1.7rem;font-weight:700}

@media (min-width:700px){main{padding:22px 20px 110px}.panel{grid-template-columns:1fr 1fr 1fr 1fr}.tile{min-height:160px}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:no-preference){
  .opt.right{animation:pop .35s}
  .opt.wrong{animation:shake .32s}
  .conf{animation:fall 1.9s ease-in forwards}
  .tile,.btn,.opt,.item{transition:transform .08s}
  .seg i{transition:background .2s}
}
@media (prefers-reduced-motion:reduce){.conf{display:none}.ring .pr{transition:none}}
.cr{color:var(--ok);border-bottom:2px solid var(--ok);font-weight:700}
.item.a-gram,.item.a-read,.item.a-cloze,.item.a-listen{border-left:4px solid var(--acc)}
.item>.ti{width:42px;height:42px;border-radius:12px;background:rgba(var(--acc-rgb),.15);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.item .row{flex:none}
.lvh.l5 i{background:#6C47B8}
.stack>.lvh{margin-top:18px}

</style>
</head>

  tips:"Pagi, siang, sore pakai in the morning / afternoon / evening, tetapi malam pakai at night. Kalau hari disebut bersama bagiannya, pakai on: on Monday morning. Dengan next, last, this, every tidak pakai preposisi: I will see you next Monday (bukan on next Monday).",

{ id:"g19", lv:1, title:"Some, any, much, many",

  tips:"Pakai some saat menawarkan atau meminta: Would you like some tea? Di kalimat positif, much terdengar kaku. Lebih natural: I have a lot of work.",

{ id:"g22", lv:2, title:"Make dan do",

  tips:"Ingat: make a mistake (bukan do a mistake), make a decision, make a plan. Untuk tugas rutin atau pekerjaan, pakai do.",

{ id:"g25", lv:3, title:"Gerund dan infinitive",
  ringkas:"Setelah kata kerja tertentu, kata kerja berikutnya berbentuk -ing (gerund). Setelah kata kerja lain, bentuknya to + verb (infinitive).",

  contoh:[["She avoids working at night.","Dia menghindari bekerja malam hari."],["We decided to replace the pump.","Kami memutuskan mengganti pompa."],["He is good at fixing motors.","Dia ahli memperbaiki motor."]],
  tips:"Hafalkan daftarnya per kelompok. Kata to yang berfungsi sebagai preposisi tetap diikuti V-ing: I look forward to meeting you.",
  latihan:[

  ]},

{ id:"g27", lv:3, title:"Used to, be used to, get used to",
  ringkas:"Used to + verb untuk kebiasaan di masa lalu yang sudah tidak ada. Be used to + V-ing untuk sudah terbiasa. Get used to untuk proses menjadi terbiasa.",
  rumus:["used to + V1: I used to work night shifts. (dulu, sekarang tidak)","did not use to + V1: I did not use to drink coffee.","be used to + V-ing / noun: I am used to working at night. (sudah terbiasa)","get used to + V-ing / noun: I am getting used to the heat. (sedang menjadi terbiasa)"],
  contoh:[["He used to work at a gas plant.","Dulu dia bekerja di pabrik gas."],["We are used to the noise.","Kami sudah terbiasa dengan kebisingan itu."],["You will get used to the heat.","Kamu akan terbiasa dengan panasnya."]],
  tips:"Setelah be used to dan get used to, kata kerja harus berakhiran -ing. Salah: I am used to work. Benar: I am used to working. Dalam pertanyaan dan negatif, pakai use to (tanpa d): Did you use to ...?",
  latihan:[

{ id:"g28", lv:3, title:"By, until, in time, on time",
  ringkas:"By berarti paling lambat pada, until berarti terus sampai. In time berarti masih sempat, on time berarti tepat waktu sesuai jadwal.",
  rumus:["by + waktu = batas akhir: Finish the report by Friday. (paling lambat Jumat)","until + waktu = kegiatan berlangsung terus sampai saat itu: We work until 5 pm.","on time = tepat waktu sesuai jadwal: The train arrived on time.","in time = cukup cepat, tidak terlambat: The ambulance came in time to save him.","by the time + klausa = pada saat: By the time we arrived, the meeting had started."],
  contoh:[["Please send the data by Monday.","Tolong kirim datanya paling lambat Senin."],["The shift lasts until midnight.","Shift berlangsung sampai tengah malam."],["The bus arrived on time.","Busnya datang tepat waktu."]],
  tips:"Tanyakan: apakah kegiatan berlangsung terus sampai waktu itu (until), atau ada batas akhir (by)? Contoh: Do not leave until I come back berarti jangan pergi sebelum saya kembali.",
  latihan:[
    ["The report must be ready ___ Friday.",["until","by","on time","in time"],1],
    ["I will wait here ___ you finish.",["by","until","on time","in time"],1],
    ["The meeting started ___, at exactly 9 o'clock.",["by","until","on time","in time"],2],
    ["The ambulance came just ___ to save him.",["on time","in time","until","by"],1],
    ["The shift continues ___ 6 am.",["by","until","on time","in time"],1],
    ["Submit the form ___ the end of the month.",["until","by","on time","in time"],1],
    ["I worked ___ midnight last night.",["by","until","on time","in time"],1],
    ["The train is never late. It always arrives ___.",["by","until","on time","in time"],2],
    ["___ the time we arrived, the guests had left.",["Until","By","On time","In time"],1],
    ["Do not switch off the machine ___ it stops completely.",["by","until","on time","in time"],1]
  ]},
{ id:"g29", lv:3, title:"Present perfect atau simple past?",
  ringkas:"Simple past untuk kejadian yang selesai pada waktu tertentu di masa lalu. Present perfect untuk pengalaman atau kejadian lampau yang masih berhubungan dengan sekarang, tanpa menyebut waktu tertentu.",
  rumus:["Simple past + waktu lampau yang pasti: yesterday, last week, in 2020, two days ago","Present perfect (have / has + V3): I have visited the plant three times.","Present perfect + for, since, already, yet, ever, never, just","Pertanyaan When ...? dan What time ...? selalu pakai simple past"],
  contoh:[["She finished the report an hour ago.","Dia menyelesaikan laporan satu jam lalu."],["She has finished the report.","Dia sudah menyelesaikan laporan (hasilnya ada sekarang)."],["Have you ever worked at night?","Pernahkah kamu bekerja malam hari?"]],
  tips:"Kalau ada kata waktu lampau yang pasti (yesterday, last year, in 2019, ago), selalu simple past. Salah: I have seen him yesterday.",
  latihan:[
    ["I ___ the manager yesterday.",["saw","have seen","see","had seen"],0],

    ["They ___ the pump two days ago.",["have repaired","repaired","repair","repairing"],1],
    ["When ___ you join the company?",["did","have","do","are"],0],
    ["She ___ in Samarinda until 2022, then she moved.",["lived","has lived","lives","have lived"],0],
    ["Last month, we ___ a new safety rule.",["introduced","have introduced","introduce","are introduced"],0],
    ["___ you finished the report yet?",["Did","Have","Do","Were"],1],
    ["He ___ a mistake last night.",["made","has made","makes","is made"],0],

  ]},
{ id:"g30", lv:3, title:"Phrasal verb di tempat kerja",
  ringkas:"Phrasal verb adalah kata kerja + kata kecil (up, off, on, out, down) yang artinya bisa berbeda dari kata kerjanya. Sangat sering dipakai dalam percakapan kerja.",
  rumus:["turn on / turn off = menyalakan / mematikan","fill in = mengisi formulir; carry out = melaksanakan; set up = menyiapkan","break down = rusak; run out of = kehabisan; find out = mencari tahu","pick up = mengambil atau menjemput; put off = menunda; take over = mengambil alih","Kalau objeknya pronoun, letakkan di tengah: turn it off"],
  contoh:[["The pump broke down last night.","Pompa itu rusak tadi malam."],["Please fill in this form.","Tolong isi formulir ini."],["We ran out of spare parts.","Kami kehabisan suku cadang."]],
  tips:"Kalau objeknya pronoun (it, them), letakkan di tengah: turn it off. Bukan turn off it. Kalau objeknya noun, boleh dua cara: turn off the pump atau turn the pump off.",
  latihan:[

    ["The new supervisor will ___ the shift at 7.",["take over","take off","take up","take in"],0],
    ["We must ___ what caused the failure.",["find out","find off","find up","find at"],0],
    ["Do not ___ the maintenance again. It is already late.",["put off","put on","put up","put in"],0],
    ["I will ___ the visitors at the gate.",["pick up","pick out","pick off","pick in"],0],

    ["The pump is not running. Please ___.",["turn it on","turn on it","turn it up","turn up it"],0]
  ]},
{ id:"g31", lv:4, title:"Pasangan kata yang sering tertukar",
  ringkas:"Beberapa pasang kata mirip bunyi atau artinya sehingga sering tertukar, padahal pemakaiannya berbeda.",
  rumus:["affect (kata kerja) = memengaruhi. effect (kata benda) = dampak. The heat affects the pump. The effect was serious.","lend = meminjamkan. borrow = meminjam. Can you lend me a pen? Can I borrow a pen?","bring = membawa ke sini. take = membawa ke sana.","lose (kata kerja) = kehilangan. loose (kata sifat) = longgar.","rise = naik sendiri (tanpa objek). raise = menaikkan sesuatu. Prices rise. They raise prices.","hear = mendengar tanpa sengaja. listen = mendengarkan dengan sengaja."],
  contoh:[["Heat can affect the quality of the oil.","Panas dapat memengaruhi mutu oli."],["Could you lend me your helmet?","Bisakah kamu meminjamkan helmmu?"],["Check if the bolt is loose.","Periksa apakah bautnya longgar."]],
  tips:"Cara mudah mengingat: Affect = Action (kata kerja), Effect = End result (kata benda). Lend berarti memberi, borrow berarti menerima.",
  latihan:[
    ["The new rule will ___ all workers.",["affect","effect","effects","affects"],0],
    ["The ___ of the heat was serious.",["affect","effect","affected","affects"],1],
    ["Can I ___ your pen for a minute?",["lend","borrow","lose","loose"],1],
    ["Could you ___ me your helmet?",["lend","borrow","take","bring"],0],
    ["Please ___ this document to the manager's office.",["bring","take","come","go"],1],
    ["The bolt is ___. Please tighten it.",["lose","loose","lost","losing"],1],
    ["Do not ___ the key again!",["lose","loose","lost","losing"],0],
    ["Prices usually ___ in winter.",["rise","raise","rose","raised"],0],
    ["The company will ___ salaries next year.",["rise","raise","rose","arise"],1],
    ["I can ___ a strange noise from the pump.",["hear","listen","listen to","watch"],0]
  ]},
{ id:"g32", lv:4, title:"Wish dan if only",
  ringkas:"Wish dan if only dipakai untuk menyatakan penyesalan atau keinginan yang tidak sesuai kenyataan. Bentuk kata kerjanya mundur satu tingkat.",
  rumus:["wish + past simple: keinginan untuk situasi sekarang. I wish I had more time. (kenyataannya tidak punya)","wish + past perfect: penyesalan masa lalu. I wish I had checked it. (kenyataannya tidak dicek)","wish + would: keinginan agar sesuatu berubah. I wish it would stop raining.","if only = lebih kuat dari wish, pola sama: If only I knew the answer."],
  contoh:[["I wish I had a bigger office.","Seandainya saya punya kantor lebih besar."],["I wish I had checked the valve.","Seandainya saya tadi memeriksa katupnya."],["I wish it would stop raining.","Saya berharap hujan berhenti."]],
  tips:"Dalam bahasa formal, pakai were untuk semua subjek: I wish I were taller. Wish tidak diikuti will. Gunakan would.",
  latihan:[
    ["I wish I ___ more free time.",["have","had","will have","would have"],1],
    ["I wish I ___ the manual before the test.",["read","had read","have read","would read"],1],
    ["I wish it ___ cooler today.",["is","were","will be","has been"],1],
    ["If only I ___ the answer now!",["know","knew","had known","will know"],1],
    ["He wishes he ___ the meeting yesterday.",["attended","had attended","attends","would attend"],1],
    ["I wish the noise ___ stop.",["will","would","did","had"],1],
    ["She wishes she ___ in a bigger city.",["lives","lived","will live","has lived"],1],
    ["If only we ___ the leak earlier!",["found","had found","find","would find"],1],
    ["I wish I ___ a car. The bus is always late.",["have","had","would have","am having"],1],
    ["They wish they ___ more careful last week.",["were","had been","are","would be"],1]
  ]}
);

// ===== LEVEL IELTS (level 5) =====
// cat: a = akademik
V[5] = [
["substantial","cukup besar; substansial","adj","There has been a substantial rise in rents.","Ada kenaikan sewa yang cukup besar.","a"],
["conduct","melakukan (penelitian)","v","Researchers conducted a survey last year.","Para peneliti melakukan survei tahun lalu.","a","conducted"],
["factor","faktor","n","Cost is a key factor in the decision.","Biaya adalah faktor kunci dalam keputusan itu.","a"],
["phenomenon","fenomena","n","Urbanisation is a global phenomenon.","Urbanisasi adalah fenomena global.","a"],
["issue","masalah; isu","n","Climate change is a global issue.","Perubahan iklim adalah isu global.","a"],
["aspect","aspek","n","Cost is an important aspect of the decision.","Biaya adalah aspek penting dari keputusan itu.","a"],
["approach","pendekatan","n","A new approach to teaching is needed.","Pendekatan baru dalam mengajar diperlukan.","a"],
["benefit","manfaat; menguntungkan","v","Public transport benefits everyone in the city.","Transportasi umum menguntungkan semua orang di kota.","a","benefits"],
["drawback","kekurangan","n","The main drawback of the plan is its cost.","Kekurangan utama rencana itu adalah biayanya.","a"],
["tackle","mengatasi","v","Governments must tackle unemployment.","Pemerintah harus mengatasi pengangguran.","a"],
["diminish","berkurang; mengurangi","v","The importance of coal has diminished over time.","Pentingnya batu bara berkurang seiring waktu.","a","diminished"],
["enhance","meningkatkan mutu","v","Technology can enhance learning.","Teknologi dapat meningkatkan mutu pembelajaran.","a"],
["consume","mengonsumsi; memakai","v","Factories consume a large amount of energy.","Pabrik memakai energi dalam jumlah besar.","a"],
["resource","sumber daya","n","Water is a limited resource.","Air adalah sumber daya yang terbatas.","a"],
["adequate","memadai","adj","Many schools lack adequate funding.","Banyak sekolah kekurangan dana yang memadai.","a"],
["urban","perkotaan","adj","Urban areas are growing quickly.","Wilayah perkotaan tumbuh dengan cepat.","a"],
["rural","pedesaan","adj","Rural schools often lack teachers.","Sekolah di pedesaan sering kekurangan guru.","a"],
["population","jumlah penduduk","n","The population of the city has doubled.","Jumlah penduduk kota itu berlipat dua.","a"],
["trend","tren; kecenderungan","n","There is a trend towards working from home.","Ada tren bekerja dari rumah.","a"],
["access","akses","n","Many people have no access to clean water.","Banyak orang tidak punya akses ke air bersih.","a"],
["opportunity","kesempatan","n","Education gives young people more opportunities.","Pendidikan memberi anak muda lebih banyak kesempatan.","a","opportunities"],
["curb","menekan; membatasi","v","The government wants to curb air pollution.","Pemerintah ingin menekan polusi udara.","a"],
["innovation","inovasi","n","Innovation drives economic growth.","Inovasi mendorong pertumbuhan ekonomi.","a"],
["awareness","kesadaran","n","The campaign raised awareness of health risks.","Kampanye itu meningkatkan kesadaran akan risiko kesehatan.","a"],
["prioritise","mengutamakan","v","Governments should prioritise education.","Pemerintah sebaiknya mengutamakan pendidikan.","a"],
["emerge","muncul","v","New industries emerge as technology changes.","Industri baru muncul seiring perubahan teknologi.","a"],
["predict","memprediksi","v","Scientists predict that sea levels will rise.","Para ilmuwan memprediksi permukaan laut akan naik.","a"],
["obtain","memperoleh","v","Students can obtain a degree in four years.","Mahasiswa dapat memperoleh gelar dalam empat tahun.","a"],
["widespread","meluas","adj","Smartphone use is widespread among teenagers.","Penggunaan ponsel pintar meluas di kalangan remaja.","a"],
["inequality","ketimpangan","n","Income inequality is increasing.","Ketimpangan pendapatan meningkat.","a"],
["disparity","kesenjangan","n","There is a large disparity between rich and poor.","Ada kesenjangan besar antara yang kaya dan miskin.","a"],
["crucial","sangat penting","adj","Early diagnosis is crucial.","Diagnosis dini sangat penting.","a"],
["beneficial","bermanfaat","adj","Regular exercise is beneficial for the heart.","Olahraga teratur bermanfaat untuk jantung.","a"],
["outweigh","lebih besar daripada","v","The advantages outweigh the disadvantages.","Keuntungannya lebih besar daripada kerugiannya.","a"],
["decline","menurun; penurunan","v","The birth rate continues to decline.","Angka kelahiran terus menurun.","a"],
["rely","bergantung","v","Many people rely on public transport.","Banyak orang bergantung pada transportasi umum.","a"],
["attitude","sikap","n","Attitudes to work have changed.","Sikap terhadap pekerjaan sudah berubah.","a","Attitudes"],
["generation","generasi","n","The older generation prefers traditional methods.","Generasi yang lebih tua lebih suka cara tradisional.","a"],
["controversial","kontroversial","adj","Nuclear power is a controversial topic.","Tenaga nuklir adalah topik yang kontroversial.","a"],
["emphasise","menekankan","v","The report emphasises the need for change.","Laporan itu menekankan perlunya perubahan.","a","emphasises"]
];

G.push(
{ id:"g33", lv:5, title:"Although, despite, whereas, however",
  ringkas:"Untuk menyatakan pertentangan. Although dan while diikuti klausa (subjek + kata kerja). Despite dan in spite of diikuti noun atau V-ing. Whereas membandingkan dua hal yang berbeda. However dan nevertheless menghubungkan dua kalimat.",
  rumus:["Although / even though + klausa: Although it was raining, we continued.","Despite / in spite of + noun atau V-ing: Despite the rain, we continued.","Despite the fact that + klausa: Despite the fact that it was raining, we continued.","Whereas / while + klausa (kontras dua hal): Cities are crowded, whereas villages are quiet.","However / Nevertheless + koma, di awal kalimat baru: It was raining. However, we continued."],
  contoh:[["Although the cost was high, the project went ahead.","Meskipun biayanya tinggi, proyek tetap jalan."],["Despite the high cost, the project went ahead.","Terlepas dari biaya yang tinggi, proyek tetap jalan."],["Rural areas are quiet, whereas cities are noisy.","Daerah pedesaan tenang, sedangkan kota bising."]],
  tips:"Jangan pakai although dan but dalam satu kalimat. Salah: Although it was cold, but we went. Despite tidak pernah diikuti of: despite of (salah), in spite of (benar).",
  latihan:[
    ["___ the heavy traffic, he arrived on time.",["Although","Despite","However","Whereas"],1],
    ["___ he was tired, he kept working.",["Despite","In spite of","Although","However"],2],
    ["Solar power is clean, ___ coal power produces much pollution.",["despite","whereas","in spite","therefore"],1],
    ["In spite ___ the rain, the match continued.",["of","from","to","for"],0],
    ["The test was difficult. ___, most students passed.",["Although","Despite","However","Whereas"],2],
    ["Despite ___ very hard, she failed the exam.",["study","studied","studying","to study"],2],
    ["___ the fact that the price rose, people kept buying.",["Despite","Although","In spite","Whereas"],0],
    ["Many people prefer cities, ___ others like the countryside.",["despite","whereas","in spite of","however"],1],
    ["___ its small size, the engine is very powerful.",["Although","Despite","Whereas","However"],1],
    ["She is rich. ___, she lives very simply.",["Nevertheless","Despite","Although","Whereas"],0]
  ]},
{ id:"g34", lv:5, title:"Passive dan reporting verbs",
  ringkas:"Dalam tulisan akademik, passive voice dan struktur seperti It is said that ... dipakai agar tulisan terdengar objektif dan formal.",
  rumus:["It is said / believed / thought / reported that + klausa: It is believed that the economy will grow.","Subjek + is said / believed + to + V1: The method is believed to be effective.","Subjek + is said + to have + V3 (kejadian lampau): The bridge is said to have been built in 1920.","Passive modal: can be done, should be taken, must be checked","Passive perfect: has been completed, have been replaced"],
  contoh:[["It is estimated that 40 percent of energy is wasted.","Diperkirakan 40 persen energi terbuang."],["The method is believed to be effective.","Metode ini diyakini efektif."],["The bridge is said to have been built in 1920.","Jembatan itu konon dibangun tahun 1920."]],
  tips:"Setelah is believed atau is said, pakai to + verb dasar untuk keadaan sekarang, dan to have + V3 untuk kejadian lampau.",
  latihan:[
    ["It ___ that crime rates are rising.",["believes","is believed","believed to","has believe"],1],
    ["The scheme is thought ___ successful.",["be","to be","being","been"],1],
    ["The old building is said ___ in 1850.",["to build","to be built","to have been built","building"],2],
    ["Many measures ___ to reduce pollution.",["have taken","have been taken","has been take","are took"],1],
    ["It ___ that the number of students will double.",["expects","is expected","expected","was expecting"],1],
    ["Plastic waste ___ reduced by recycling.",["can","can be","can been","does be"],1],
    ["The results ___ in the table below.",["show","are shown","are showing","shown are"],1],
    ["The company is reported ___ money last year.",["to lose","to have lost","losing","lost"],1],
    ["It is widely ___ that exercise improves health.",["accept","accepted","accepting","to accept"],1],
    ["Several new schools ___ since 2015.",["built","were built","have been built","are building"],2]
  ]},
{ id:"g35", lv:5, title:"Nominalisation (kata kerja jadi kata benda)",
  ringkas:"Penulis akademik sering mengubah kata kerja atau kata sifat menjadi kata benda agar kalimat lebih padat dan formal.",
  rumus:["increase (v) menjadi an increase (n); decrease menjadi a decrease","develop menjadi development; decide menjadi decision; reduce menjadi reduction","grow menjadi growth; fail menjadi failure; improve menjadi improvement","able menjadi ability; available menjadi availability; important menjadi importance","a / the + adjektiva + noun: a sharp rise, a steady growth"],
  contoh:[["Prices rose sharply. / There was a sharp rise in prices.","Harga naik tajam."],["The government decided quickly. / The government's decision was quick.","Pemerintah memutuskan dengan cepat."],["Many people lost their jobs. / The loss of jobs was serious.","Banyak orang kehilangan pekerjaan."]],
  tips:"Perhatikan kelas kata. Setelah a, the, atau adjektiva seperti sharp, butuh kata benda, bukan kata kerja. Contoh: a decision (benda), to decide (kerja).",
  latihan:[
    ["There has been a sharp ___ in house prices.",["increase","increased","increasing","increasingly"],0],
    ["The ___ of new technology has changed our lives.",["develop","development","developing","developed"],1],
    ["Their ___ to leave was sudden.",["decide","decision","decided","deciding"],1],
    ["The government wants to achieve economic ___.",["grow","growth","grew","growing"],1],
    ["The ___ of fuel use has helped the environment.",["reduce","reduction","reducing","reduced"],1],
    ["Students need regular ___ of their progress.",["assess","assessment","assessing","assessed"],1],
    ["The ___ of clean water is a global issue.",["available","availability","avail","availably"],1],
    ["This is a major ___ in medical research.",["advance","advanced","advancing","advancely"],0],
    ["Her ___ to speak three languages helped her career.",["able","ability","ably","enable"],1],
    ["There was a slight ___ in unemployment.",["fall","fell","fallen","fall down"],0]
  ]},
{ id:"g36", lv:5, title:"Menjelaskan grafik (Writing Task 1)",
  ringkas:"Untuk IELTS Writing Task 1, kamu butuh kata kerja dan kata benda untuk perubahan angka, serta preposisi yang tepat untuk angka dan waktu.",
  rumus:["Naik: rise - rose - risen, increase, grow, climb. Benda: a rise, an increase","Turun: fall - fell - fallen, decrease, decline, drop. Benda: a fall, a decline","Stabil: remain stable, stay constant, level off. Naik turun: fluctuate","Puncak dan terendah: peak at, reach a peak of, hit a low of","Preposisi: rise FROM 10 TO 20, rise BY 10 (selisih), at 20% (pada angka), IN 2010, BETWEEN 2010 AND 2020","Kecepatan: sharply, dramatically, steadily, gradually, slightly"],
  contoh:[["The number rose from 20% to 35% between 2000 and 2010.","Jumlahnya naik dari 20% menjadi 35% antara 2000 dan 2010."],["Sales increased by 15%.","Penjualan naik sebesar 15%."],["The figure peaked at 60% in 2015.","Angkanya memuncak pada 60% di 2015."]],
  tips:"Rise, fall, dan grow tidak punya objek sehingga tidak bisa passive. Bedakan by (selisih) dan to (angka akhir): rose by 5% berbeda dari rose to 25%. Raise butuh objek: The company raised prices.",
  latihan:[
    ["Sales ___ from 200 to 350 between 2010 and 2015.",["rose","raised","arose","rised"],0],
    ["The price fell ___ 10%, from $50 to $45.",["by","to","at","on"],0],
    ["The number of users peaked ___ 5 million in 2018.",["by","at","on","of"],1],
    ["Unemployment remained ___ at 5% for three years.",["stable","stably","stability","stabilise"],0],
    ["There was a ___ increase in sales, from 10 to 80 in one year.",["slight","dramatic","gradual","steady"],1],
    ["The figure ___ between 40% and 60% throughout the period.",["fluctuated","remained","rose","peaked"],0],
    ["Between 2000 and 2010, the population ___ steadily.",["grew","was grown","growed","grow"],0],
    ["Exports rose ___ $2 billion in 2010 to $5 billion in 2020.",["from","by","at","in"],0],
    ["The population has ___ by 20% since 2000.",["risen","rose","rise","raised"],0],
    ["The figure ___ to a low of 12% in 2012.",["dropped","raised","rose","climbed"],0]
  ]},
{ id:"g37", lv:5, title:"Inversion dan penekanan",
  ringkas:"Inversion (membalik urutan auxiliary dan subjek) dipakai setelah kata negatif atau pembatas di awal kalimat untuk penekanan. Pola ini sering muncul di tulisan IELTS tingkat tinggi.",
  rumus:["Not only + auxiliary + subjek + V, but also ...: Not only did he fail, but he also lost his job.","Never / Rarely / Seldom / Hardly + auxiliary + subjek: Rarely do we see such results.","No sooner + had + subjek + V3 + than: No sooner had he left than it rained.","Only when / Only after + auxiliary + subjek: Only when prices fell did sales improve.","Conditional inversion: Had I known ... / Should you need ... / Were he here ..."],
  contoh:[["Not only did the plan fail, but it also cost millions.","Rencananya tidak hanya gagal, tetapi juga menghabiskan jutaan."],["Rarely do students read the full report.","Jarang sekali siswa membaca laporan penuh."],["Had we acted sooner, the damage would have been smaller.","Seandainya kita bertindak lebih cepat, kerusakannya lebih kecil."]],
  tips:"Setelah kata negatif di awal kalimat, urutannya seperti kalimat tanya (auxiliary dulu), tetapi tetap kalimat pernyataan. Kalau tidak ada auxiliary, pakai do, does, atau did.",
  latihan:[
    ["Not only ___ the exam, but she also won a prize.",["she passed","did she pass","she did pass","passed she"],1],
    ["Rarely ___ such a beautiful place.",["I have seen","have I seen","I saw","did I seen"],1],
    ["No sooner had he arrived ___ the meeting began.",["when","than","then","that"],1],
    ["___ I known about the delay, I would have left earlier.",["If","Had","Have","Did"],1],
    ["Never ___ such a difficult problem before.",["we faced","had we faced","we had faced","did we faced"],1],
    ["Only after the test ___ the answer.",["he knew","did he know","he did know","knew he"],1],
    ["Hardly ___ the room when the alarm rang.",["had she entered","she had entered","she entered","did she entered"],0],
    ["___ you need more information, please contact us.",["Should","Would","Could","Might"],0],
    ["Seldom ___ so many people in the hall.",["there were","were there","there had","did there were"],1],
    ["Not until the end of the year ___ the results.",["they published","did they publish","they did publish","published they"],1]
  ]},
{ id:"g38", lv:5, title:"Linking words akademik",
  ringkas:"Kata penghubung yang tepat membuat tulisan koheren, dan koherensi adalah salah satu kriteria penilaian IELTS Writing.",
  rumus:["Tambahan: moreover, furthermore, in addition","Kontras: however, nevertheless, in contrast, on the other hand","Sebab: because of, due to, owing to + noun. because, since, as + klausa","Akibat: therefore, consequently, as a result, thus","Contoh: for instance, for example, such as","Kesimpulan: in conclusion, to sum up, overall"],
  contoh:[["The cost is high. Moreover, the process is slow.","Biayanya tinggi. Lagi pula, prosesnya lambat."],["Due to the storm, the flight was cancelled.","Karena badai, penerbangan dibatalkan."],["Prices rose. As a result, fewer people bought cars.","Harga naik. Akibatnya, lebih sedikit orang membeli mobil."]],
  tips:"Due to dan because of diikuti noun, because diikuti klausa. Beri koma setelah kata penghubung di awal kalimat. Jangan pakai however untuk menyambung dua klausa dalam satu kalimat tanpa titik atau titik koma.",
  latihan:[
    ["The factory closed ___ the lack of demand.",["because","due to","since of","as"],1],
    ["The roads were icy. ___, many accidents happened.",["Because","Consequently","Although","Despite"],1],
    ["Renewable energy is clean. ___, it is becoming cheaper.",["In contrast","Moreover","However","Because"],1],
    ["Some people love cities. ___, others prefer rural life.",["Moreover","Therefore","On the other hand","As a result"],2],
    ["Many countries, ___ Japan and Korea, have ageing populations.",["such as","such","for such","as such"],0],
    ["The company lost its biggest client. ___, it had to cut staff.",["As a result","In contrast","For instance","Besides"],0],
    ["___ the bad weather, the event went ahead.",["Because of","Due to","Despite","Therefore"],2],
    ["___, the evidence shows that exercise is beneficial.",["In conclusion","Moreover","For instance","Whereas"],0],
    ["The service is slow and expensive. ___, it is unreliable.",["Furthermore","However","Nevertheless","Despite"],0],
    ["He did not study. ___, he passed the exam.",["Therefore","Nevertheless","Moreover","Because"],1]
  ]},
{ id:"g39", lv:5, title:"Hedging (bahasa yang hati-hati)",
  ringkas:"Penulis akademik jarang membuat klaim mutlak. Hedging dipakai untuk melunakkan pernyataan supaya terdengar objektif dan bisa dipertanggungjawabkan.",
  rumus:["Modal: may, might, could, can + V1. Pollution may cause health problems.","Kata kerja: seem, appear, tend to, suggest. Prices tend to rise in winter.","Adjektiva dan adverbia: likely, probably, possibly, generally, often, in most cases","Struktur: It is possible that ..., It seems that ..., There is evidence to suggest that ...","Hindari kata mutlak: always, never, all, everyone, prove"],
  contoh:[["Technology may reduce unemployment.","Teknologi mungkin mengurangi pengangguran."],["Young people tend to use social media more.","Anak muda cenderung lebih sering memakai media sosial."],["This suggests that the policy is effective.","Ini menunjukkan bahwa kebijakan tersebut efektif."]],
  tips:"Bandingkan: Smartphones destroy concentration (mutlak) dengan Smartphones may reduce concentration (hati-hati). Penilai IELTS menyukai pernyataan yang seimbang dan tidak berlebihan.",
  latihan:[
    ["The new law ___ reduce crime, but we cannot be sure.",["may","will","must","does"],0],
    ["Young drivers ___ to have more accidents.",["tend","tends","tending","tendency"],0],
    ["It ___ that the policy has been effective.",["seems","seem","seeming","is seem"],0],
    ["The data are limited, so this study only ___ that more research is needed.",["proves","suggests","guarantees","demands"],1],
    ["___ people prefer online shopping, but not everyone.",["All","Most","Every","No"],1],
    ["We cannot be sure, but it is ___ that prices will rise next year.",["certain","likely","impossible","proven"],1],
    ["Exercise ___ help to reduce stress, although it depends on the person.",["can","always","must","will"],0],
    ["___, children learn languages faster than adults.",["Always","Generally","Never","Everyone"],1],
    ["There is some evidence ___ that diets affect mood.",["to suggest","suggest","suggesting","suggests"],0],
    ["In some cases, solar panels ___ be the best solution.",["might","will certainly","must always","do"],0]
  ]},
{ id:"g40", lv:5, title:"The number of, a number of, dan proporsi",
  ringkas:"Dalam IELTS Task 1 kamu sering menyebut jumlah dan proporsi. Beberapa frasa terlihat mirip, tetapi kata kerjanya berbeda.",
  rumus:["The number of + jamak + kata kerja tunggal: The number of students is rising.","A number of + jamak + kata kerja jamak: A number of students are late. (beberapa)","The amount of + benda tak terhitung: the amount of water","The proportion / percentage of + noun + kata kerja tunggal: The proportion of women is 40%.","The majority of + jamak + kata kerja jamak: The majority of people use buses.","Fewer + benda terhitung, less + benda tak terhitung: fewer cars, less traffic","twice as high as, three times higher than, half of, a quarter of"],
  contoh:[["The number of cars has increased.","Jumlah mobil meningkat."],["A number of factories are closing.","Beberapa pabrik tutup."],["There are fewer jobs and less money.","Pekerjaan lebih sedikit dan uang lebih sedikit."]],
  tips:"The number of memakai kata kerja tunggal karena yang dibicarakan adalah satu angka. A number of memakai kata kerja jamak karena artinya beberapa. Fewer untuk yang bisa dihitung, less untuk yang tidak.",
  latihan:[
    ["The number of tourists ___ growing every year.",["is","are","have","do"],0],
    ["A number of students ___ absent today.",["is","are","was","has"],1],
    ["There were ___ cars than last year.",["less","fewer","little","much"],1],
    ["There is ___ traffic than before.",["fewer","less","many","a few"],1],
    ["The proportion of women in the workforce ___ 45%.",["are","is","were","have"],1],
    ["The majority of people ___ public transport.",["uses","use","is using","has used"],1],
    ["The amount of plastic waste ___ increased.",["have","has","are","were"],1],
    ["Sales in 2020 were ___ high as in 2010.",["twice as","twice more","double as","two as"],0],
    ["A quarter of the students ___ abroad.",["study","studies","is studying","has studied"],0],
    ["Fewer than 5% of households ___ a car.",["owns","own","is owning","has owned"],1]
  ]}
);

S.push(
{ id:"s13", lv:5, title:"Working from Home",
  text:"In recent years, the number of people who work from home has risen sharply. A survey of 2,000 employees in 2023 found that 62 percent would like to work remotely at least three days a week. Supporters argue that remote work saves commuting time, reduces costs for companies, and allows staff to balance family life more easily. Some employers, however, are concerned about productivity. They claim that employees who stay at home are more easily distracted and communicate less with colleagues. Research on this question is not conclusive. One study found that productivity rose by 13 percent among call-centre workers who stayed at home, while another reported that creative teams produced fewer new ideas when they did not meet face to face. Experts therefore suggest a hybrid model, in which staff spend part of the week in the office and part at home.",
  q:[
    ["According to the survey, what percentage of employees want to work remotely at least three days a week?",["13 percent","62 percent","2,000 percent","Not stated"],1],
    ["True, False, or Not given: All employers agree that remote work is good for productivity.",["True","False","Not given"],1],
    ["True, False, or Not given: In one study, call-centre workers produced more when they worked at home.",["True","False","Not given"],0],
    ["True, False, or Not given: Most companies in the survey have already adopted a hybrid model.",["True","False","Not given"],2],
    ["What do experts suggest?",["Everyone should work in the office","A mixture of home and office work","Closing call centres","Banning remote work"],1]
  ]},
{ id:"s14", lv:5, title:"Green Spaces in Cities",
  text:"Urban planners increasingly recognise the value of green spaces such as parks and community gardens. Studies show that residents who live within 500 metres of a park are more likely to exercise regularly and report lower levels of stress. Green areas also reduce the urban heat island effect, because trees provide shade and release moisture into the air. In some cities, summer temperatures in tree-lined streets are up to four degrees lower than in streets with little vegetation. Nevertheless, creating new parks is expensive, and land in city centres is scarce. As a result, some cities have turned to alternatives, including planting trees along roads and building gardens on rooftops. Although these measures are less effective than large parks, they are much cheaper and can be introduced quickly.",
  q:[
    ["Residents who live near a park are more likely to ...",["move to rural areas","exercise regularly","earn more money","use public transport"],1],
    ["True, False, or Not given: Trees can lower temperatures in streets.",["True","False","Not given"],0],
    ["True, False, or Not given: Rooftop gardens are more effective than large parks.",["True","False","Not given"],1],
    ["True, False, or Not given: Community gardens are cheaper to build than rooftop gardens.",["True","False","Not given"],2],
    ["Why are alternatives such as rooftop gardens popular?",["They are cheaper and quick to introduce","They are larger than parks","They remove all pollution","They need no maintenance"],0]
  ]},
{ id:"s15", lv:5, title:"Sleep and Study",
  text:"Many teenagers do not get enough sleep. Medical experts recommend between eight and ten hours a night for young people, yet surveys suggest that around 70 percent of high-school students sleep for less than eight hours on school nights. One reason is that teenagers' body clocks naturally shift, so they feel sleepy later in the evening and find it hard to wake up early. Another reason is the widespread use of phones and tablets before bed, as the light from screens may delay the release of melatonin, a hormone that helps people fall asleep. Lack of sleep has been linked to poor concentration, lower exam results and a higher risk of accidents. In response, several schools have started their lessons an hour later. Early results are encouraging: attendance has improved and students report feeling more alert, although it is too early to say whether grades have risen.",
  q:[
    ["How many hours of sleep do experts recommend for young people?",["Six to seven","Eight to ten","Ten to twelve","Twelve or more"],1],
    ["True, False, or Not given: Screen light may make it harder to fall asleep.",["True","False","Not given"],0],
    ["True, False, or Not given: Attendance has improved in schools with later start times.",["True","False","Not given"],0],
    ["True, False, or Not given: Teenagers who play sport sleep better than other teenagers.",["True","False","Not given"],2],
    ["What is melatonin?",["A hormone that helps people sleep","A type of screen light","A medicine for headaches","A school subject"],0]
  ]},
{ id:"s16", lv:5, title:"The Plastic Problem",
  text:"Every year, around eight million tonnes of plastic enter the oceans. Much of it breaks into tiny pieces called microplastics, which are eaten by fish and may eventually reach human food. Governments have responded in different ways. Some countries have banned single-use plastic bags, while others have introduced a small charge. In Ireland, a tax of 15 cents per bag introduced in 2002 reduced bag use by about 90 percent within a year. Critics point out, however, that bans alone cannot solve the problem, since most plastic waste comes from packaging, not bags. They argue that manufacturers should be made responsible for the entire life of their products, from production to disposal. Although recycling is often promoted as the answer, only around nine percent of all plastic ever produced has been recycled.",
  q:[
    ["How much plastic enters the oceans each year?",["Eight million tonnes","Nine million tonnes","Fifteen million tonnes","Ninety million tonnes"],0],
    ["True, False, or Not given: The Irish bag tax reduced bag use sharply.",["True","False","Not given"],0],
    ["True, False, or Not given: Most plastic waste comes from plastic bags.",["True","False","Not given"],1],
    ["True, False, or Not given: Microplastics have been proven to harm human health.",["True","False","Not given"],2],
    ["What do critics suggest?",["Manufacturers should take responsibility for their products","All plastic should be recycled by hand","Charges should be removed","People should stop eating fish"],0]
  ]}
);
