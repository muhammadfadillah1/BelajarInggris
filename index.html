{ id:"s40", lv:3, title:"The New Shift System",
  text:"Last year, the plant changed its shift system. Before the change, operators worked six days in a row on the same shift and then had two days off. Many people complained that this system was tiring, particularly for those who worked at night. Some operators also said that they hardly saw their children during the working week.\n\nThe management formed a small team to look for a better system. The team interviewed operators, supervisors and even the families of some workers. They also studied how other plants arrange their shifts. After three months, they suggested a rotation in which each operator works two morning shifts, two afternoon shifts and two night shifts, followed by three days off.\n\nAt first, a lot of people were doubtful. They thought that changing the time of sleep so often would be worse than working a fixed shift. However, the plant organised a short course about sleep and nutrition, and it also provided a quiet room for rest. After the trial period of two months, a survey showed that seventy per cent of the operators preferred the new system. The number of small mistakes in the logbook also decreased.\n\nThe plant has not solved every problem. Some operators still find night shifts difficult, and the new system needs more careful planning when someone is sick. Even so, the manager believes that the change was worth the effort, because a rested operator is a safer operator.",
  q:[
    ["What was the old shift system?",["Six days on the same shift, then two days off","Two morning shifts then three days off","Five days on, five days off","Only night shifts"],0],
    ["Who did the team interview?",["Operators, supervisors and some families","Only managers","Only contractors","Customers of the plant"],0],
    ["What does the new rotation include?",["Two morning, two afternoon and two night shifts, then three days off","Only morning shifts","Six night shifts in a row","One shift per week"],0],
    ["What did the survey show after the trial?",["Seventy per cent preferred the new system","Most operators wanted the old system","Nobody answered the survey","Half of the operators resigned"],0],
    ["What is still a problem?",["Night shifts are difficult for some operators","The plant has too many operators","The logbook is lost","Families complain about the salary"],0]
  ]},
{ id:"s41", lv:4, title:"The Investigation of a Boiler Trip",
  text:"At 2.40 a.m. last Thursday, Unit 2 tripped unexpectedly. The operators followed the emergency procedure and brought the unit to a safe condition within fifteen minutes. Nobody was injured, and no equipment was damaged. Nevertheless, the loss of production was considerable, and the plant manager asked for a full investigation to find out what had happened.\n\nThe investigation team began by collecting the data from the control system. The records showed that the water level in the boiler drum had dropped sharply a few seconds before the trip. The team then interviewed the operator on duty, who explained that the level indicator had shown a normal value until the very last moment. This was a significant clue, since it suggested that the instrument itself might be faulty.\n\nWhen the technicians examined the level transmitter, they discovered that a small valve on the sensing line had been left partially closed during the previous maintenance. As a result, the transmitter had responded slowly to changes in the real water level. The valve had been closed by a technician who had been interrupted by an urgent call and had not completed the checklist.\n\nThe team concluded that the direct cause was the closed valve, but the root cause was the lack of a second check after maintenance on safety-related instruments. The recommendations were straightforward: introduce an independent verification before any instrument is returned to service, and ensure that technicians are not interrupted while they complete critical checklists. The manager approved both proposals and asked for them to be implemented within a month.",
  q:[
    ["What happened at 2.40 a.m.?",["Unit 2 tripped unexpectedly","A boiler exploded","A worker was injured","The plant lost its fuel supply"],0],
    ["What did the data show before the trip?",["The water level in the drum dropped sharply","The pressure rose slowly","The temperature remained stable","The pump stopped at once"],0],
    ["Why did the level indicator show a normal value?",["A valve on the sensing line was partly closed","The operator ignored it","The screen was turned off","The drum was empty"],0],
    ["What was the root cause according to the team?",["No second check after maintenance on safety instruments","The technician was dishonest","The valve was too old","The operator was too slow"],0],
    ["What did the team recommend?",["Independent verification and no interruptions during critical checklists","Replacing all valves","Dismissing the technician","Shutting down the unit for a year"],0]
  ]},
{ id:"s42", lv:4, title:"Switching to Solar Power",
  text:"A textile factory in Central Java decided two years ago to install solar panels on its roof. The decision was not made lightly. The owner, Mr Hadi, had read that the price of panels had fallen by more than half in a decade, and his electricity bill was becoming his biggest expense. However, his accountant warned him that the initial investment would be high and that the payback period might be longer than expected.\n\nThe project began with a feasibility study, which showed that the roof received enough sunshine to supply about thirty per cent of the factory's daytime demand. The engineers also noted that the roof needed reinforcement, which added to the cost. Although the factory could have borrowed money from a bank, Mr Hadi preferred to use part of his savings because he wanted to avoid paying interest.\n\nThe installation took four months, during which production continued normally. Once the system was running, the results exceeded the expectations of the team. The factory reduced its monthly electricity bill by almost a quarter, and the owner calculated that the investment would be recovered in six years instead of the eight that had been predicted. The panels also gave the factory a marketing advantage, since several foreign buyers prefer suppliers with a lower carbon footprint.\n\nOf course, the system has limitations. It does not produce electricity at night, and its output falls on cloudy days. Mr Hadi is now considering the addition of batteries, but he says that he will wait until their price falls further. 'We should not expect solar power to solve every problem,' he says. 'But it has certainly made our business stronger.'",
  q:[
    ["Why did Mr Hadi consider solar panels?",["His electricity bill was his biggest expense","His roof was damaged","A foreign buyer ordered them","The government forced him"],0],
    ["What did the accountant warn about?",["High initial investment and a long payback period","A shortage of panels","Roof leaks","Low sunshine"],0],
    ["How did Mr Hadi pay for the system?",["Partly with his savings","Fully with a bank loan","With a government gift","By selling the factory"],0],
    ["How long will the investment take to be recovered?",["Six years","Eight years","Two years","Twenty years"],0],
    ["What is one limitation of the system?",["It does not produce electricity at night","It makes the factory hotter","It needs daily cleaning by hand","It cannot be used in the rain forest"],0]
  ]},
{ id:"s43", lv:4, title:"A Difficult Negotiation",
  text:"Last quarter, the purchasing department had to negotiate a new contract with the coal supplier. The previous contract had expired, and the supplier asked for a price that was twelve per cent higher. The finance director said that this was unacceptable because the company's budget was already under pressure. Nevertheless, a shortage of coal would force the plant to reduce its output, so the negotiation could not be too aggressive.\n\nThe lead negotiator, Ms Laras, prepared carefully. She began by collecting information about the market price over the past two years and about the other suppliers that could deliver to the plant. She also asked the operations team to estimate how much coal the plant could store. This information gave her a clear idea of how long the plant could wait without risk.\n\nDuring the first meeting, she did not argue about the price. Instead, she asked the supplier to explain the reasons for the increase. The supplier mentioned higher transport costs and a new government tax. Ms Laras then proposed a longer contract of three years in exchange for a smaller increase. This offered the supplier stability, which it valued highly.\n\nAfter three rounds of discussion, both sides agreed on an increase of five per cent, together with a clause that allowed the price to be reviewed if the market changed significantly. The finance director was satisfied. When asked about her secret, Ms Laras said, 'A good negotiation is not a fight. It is a search for a solution that both sides can accept.'",
  q:[
    ["Why was the supplier's first offer a problem?",["The price was twelve per cent higher","The coal was of poor quality","The contract was too short","The supplier refused to deliver"],0],
    ["What did Ms Laras collect before the meeting?",["Market prices and information on other suppliers","Her colleagues' opinions on salary","Photos of the coal mine","A list of the supplier's employees"],0],
    ["What did the supplier give as reasons for the increase?",["Higher transport costs and a new tax","A shortage of workers","Bad weather only","The price of oil only"],0],
    ["What did Ms Laras offer in exchange for a smaller increase?",["A longer contract of three years","Cash in advance","More coal orders next week","A bigger storage yard"],0],
    ["What was the final agreement?",["A five per cent increase with a review clause","No increase","A twelve per cent increase","A one-year contract"],0]
  ]},
{ id:"s44", lv:4, title:"The Hidden Cost of Overtime",
  text:"For many years, the maintenance department of a large factory relied on overtime to complete its work. Whenever a machine broke down, the technicians stayed late to repair it, and the managers were grateful. The overtime pay was attractive, so few people complained. However, a recent study revealed that this habit was costing the company more than anyone had realised.\n\nThe study, conducted by an external consultant, compared the work of technicians who regularly worked more than fifty hours a week with that of those who worked normal hours. The results were surprising. The tired technicians made nearly twice as many errors, and about a third of their repairs had to be redone within a month. Moreover, the sick leave among the overtime group was significantly higher.\n\nThe consultant also found that the department did not have a proper preventive maintenance programme. Because machines were repaired only after they failed, the work arrived unpredictably, and overtime became unavoidable. In other words, overtime was not a solution but a symptom of the problem.\n\nBased on these findings, the company decided to hire two more technicians and to introduce a schedule of regular inspections. In the first year, the total cost of maintenance, including the new salaries, fell by eleven per cent. Unplanned breakdowns decreased as well. One senior technician admitted that he missed the extra pay, but he added that he did not miss the exhaustion. 'I now have time for my family,' he said, 'and my repairs last longer.'",
  q:[
    ["Why did few people complain about overtime?",["The overtime pay was attractive","Nobody noticed it","The managers forbade complaints","It was only on weekends"],0],
    ["What did the study find about tired technicians?",["They made nearly twice as many errors","They worked faster","They took less sick leave","They repaired more machines"],0],
    ["What was missing in the department?",["A preventive maintenance programme","A manager","A canteen","Spare parts"],0],
    ["What did the company do?",["It hired two technicians and introduced regular inspections","It stopped paying overtime and fired staff","It bought new machines","It closed the department"],0],
    ["What was the result in the first year?",["Maintenance cost fell by eleven per cent","Maintenance cost doubled","Breakdowns increased","Nothing changed"],0]
  ]},
{ id:"s45", lv:4, title:"Reporting Mistakes Without Fear",
  text:"In many workplaces, people hide their mistakes because they are afraid of being blamed. This habit is understandable, but it can be dangerous. A small error that nobody reports today may become a serious accident tomorrow. For this reason, some companies have started to build what experts call a reporting culture.\n\nA reporting culture does not mean that mistakes are ignored. It means that the company treats a mistake as information rather than as a crime. When an employee reports an error, the first question is not 'Who did this?' but 'Why did the system allow this to happen?' In most cases, the answer is that the procedure was unclear, the equipment was badly designed, or the worker was tired. Punishing the individual does not remove any of these causes.\n\nOf course, there are limits. Deliberate violations, such as ignoring a lock-out procedure on purpose, cannot be tolerated. The key is to distinguish between honest mistakes and reckless behaviour. A few companies have written this distinction into their policy, so that everybody knows what to expect.\n\nBuilding such a culture takes time. At one factory, the safety manager began by reporting his own mistakes during the weekly meeting. At first, the employees were astonished. Within a year, however, the number of reports had grown from three to more than sixty per month, and the number of injuries had declined. 'People do not stop making mistakes,' he explained. 'They simply stop hiding them.'",
  q:[
    ["Why do people hide their mistakes?",["They are afraid of being blamed","They do not notice them","They are too busy","They want more overtime"],0],
    ["What is the first question in a reporting culture?",["Why did the system allow this to happen?","Who did this?","How much will it cost?","When will it be fixed?"],0],
    ["What cannot be tolerated?",["Deliberate violations of procedures","Honest mistakes","Late reports","Small errors in the logbook"],0],
    ["What did the safety manager do first?",["He reported his own mistakes in meetings","He punished careless workers","He bought new equipment","He cancelled the weekly meeting"],0],
    ["What happened within a year?",["Reports increased and injuries declined","Reports decreased","Injuries doubled","The manager resigned"],0]
  ]},
{ id:"s46", lv:5, title:"The Rise of Remote Work",
  text:"Before 2020, working from home was unusual in most countries. It was largely limited to freelancers and employees of a few technology companies. Managers generally believed that staff who were out of sight would also be out of control, and that productivity would suffer. The pandemic abruptly challenged this assumption, as millions of employees were told to work from home overnight.\n\nSurprisingly, many organisations discovered that their staff were able to maintain, or even increase, their output. A well-known study of call-centre workers in China found that those who worked at home completed more calls than their office colleagues, and they were also less likely to resign. Nevertheless, researchers have warned that these findings cannot be applied to every occupation. Creative work and the training of new employees, for instance, seem to benefit from face-to-face contact.\n\nRemote work also has social consequences. Some workers appreciated the time saved by not commuting, and those with young children or disabilities gained flexibility. On the other hand, others reported feelings of isolation, and a considerable number found it difficult to separate their working life from their private life. Cities, too, have been affected, because fewer office workers means fewer customers for the shops and cafes in business districts.\n\nAs a result, many companies have settled on a hybrid model, in which employees work from home on some days and at the office on others. It remains to be seen whether this compromise will last. What is clear is that the idea of a workplace as a single building is no longer taken for granted.",
  q:[
    ["True, False, or Not given: Before 2020, most employees in most countries worked from home.",["True","False","Not given"],1],
    ["True, False, or Not given: Call-centre workers in China who worked at home completed more calls than office workers.",["True","False","Not given"],0],
    ["True, False, or Not given: Remote work has reduced the number of car accidents in cities.",["True","False","Not given"],2],
    ["According to the text, which type of work seems to benefit from face-to-face contact?",["Creative work and training","Call-centre work","Accounting","Delivery work"],0],
    ["What does the writer say about the hybrid model?",["It is a compromise whose future is uncertain","It is certain to disappear","It is cheaper for every company","It is illegal in some countries"],0]
  ]},
{ id:"s47", lv:5, title:"Why Coral Reefs Are Disappearing",
  text:"Coral reefs cover less than one per cent of the ocean floor, yet they support about a quarter of all marine species. They also protect coasts from storms and provide food and income for hundreds of millions of people. Despite their importance, scientists estimate that around half of the world's coral cover has been lost since the 1950s.\n\nThe most significant threat is the rise in sea temperature caused by climate change. When water becomes too warm, corals expel the tiny algae that live in their tissue and give them their colour. This process, known as bleaching, leaves the coral weak and vulnerable to disease. If the temperature returns to normal quickly, the coral can recover; otherwise, it dies. Mass bleaching events, which were once rare, now occur every few years in some regions.\n\nHowever, climate change is not the only problem. Pollution from farms and cities carries nutrients and sediment into coastal waters, which encourages the growth of seaweed that competes with the corals. Overfishing removes the fish that eat this seaweed, and destructive practices, such as fishing with explosives, physically break the reef.\n\nSome conservation projects have achieved promising results. In several countries, local communities have established protected areas where fishing is limited, and fish populations have increased within a few years. Scientists are also growing heat-tolerant corals in laboratories and transplanting them to damaged reefs. Nevertheless, most experts agree that, without a significant reduction in greenhouse gas emissions, such efforts can only slow the decline, not stop it.",
  q:[
    ["True, False, or Not given: Coral reefs support about a quarter of all marine species.",["True","False","Not given"],0],
    ["True, False, or Not given: Coral that is bleached always dies.",["True","False","Not given"],1],
    ["True, False, or Not given: The Great Barrier Reef is the largest reef in the world.",["True","False","Not given"],2],
    ["What is the main cause of coral bleaching?",["A rise in sea temperature","Too many fish","A lack of sunlight","Cold currents"],0],
    ["What do most experts believe about conservation projects alone?",["They can slow the decline but not stop it","They have already solved the problem","They are not useful at all","They are too expensive for any country"],0]
  ]},
{ id:"s48", lv:5, title:"The Ageing Society",
  text:"In many developed countries, the proportion of people over sixty-five is rising rapidly. Japan is the most extreme example, with more than a quarter of its population in this age group, but a similar pattern is emerging in Europe, South Korea and increasingly in parts of South-East Asia. Two factors explain this trend. First, advances in medicine and nutrition have extended life expectancy. Second, birth rates have fallen, so that there are fewer young people to balance the growing number of elderly.\n\nThe economic consequences are considerable. A smaller workforce must support a larger number of retirees through taxes and pension contributions. Governments may be forced to raise the retirement age, increase taxes or reduce benefits, none of which is politically popular. In addition, the demand for healthcare is likely to rise sharply, since older people typically require more medical attention.\n\nNevertheless, an ageing population is not purely a burden. Many older people remain healthy and active, and they contribute through voluntary work, the care of grandchildren and, in some cases, continued employment. Some economists argue that the so-called silver economy, which provides products and services for older consumers, could become a significant source of growth.\n\nSolutions will probably involve a combination of measures. Several countries have encouraged immigration to increase the number of working-age residents, while others have invested in robots and automation to reduce the need for labour. Experts agree on one point: societies that start to prepare early will be in a much better position than those that wait until the problem becomes urgent.",
  q:[
    ["True, False, or Not given: Japan has more than a quarter of its population aged over sixty-five.",["True","False","Not given"],0],
    ["True, False, or Not given: Birth rates in developed countries have risen in recent decades.",["True","False","Not given"],1],
    ["True, False, or Not given: Most older people in Japan live with their children.",["True","False","Not given"],2],
    ["Which two factors explain the ageing trend?",["Longer life expectancy and lower birth rates","Higher taxes and lower salaries","More immigration and more cities","Better schools and worse hospitals"],0],
    ["What do some economists say about the silver economy?",["It could become a significant source of growth","It will damage the economy","It only helps rich countries","It is a temporary fashion"],0]
  ]},
{ id:"s49", lv:5, title:"Fast Fashion and Its Costs",
  text:"The term fast fashion refers to clothing that is designed, produced and sold very quickly and cheaply, in order to follow the latest trends. Some retailers now introduce new collections every week, and consumers buy far more garments than they did two decades ago. According to one estimate, the average person buys about sixty per cent more clothing than in the year 2000 but keeps each item for only half as long.\n\nThis model has considerable environmental consequences. The textile industry consumes enormous quantities of water, particularly in the cultivation of cotton, and the dyeing process often pollutes rivers in countries where regulations are weak. Furthermore, many cheap garments are made from synthetic fibres, which release tiny plastic particles every time they are washed. These particles eventually reach the ocean, where they are consumed by marine animals.\n\nThere are social costs as well. To keep prices low, manufacturers often depend on factories in which wages are minimal and working conditions are poor. The collapse of a garment factory in Bangladesh in 2013, which killed more than a thousand workers, drew international attention to this problem, and some brands have since signed agreements to improve safety.\n\nConsumers are not powerless. Buying fewer but better-quality items, repairing clothes and purchasing second-hand garments can all reduce the impact. A growing number of young people have adopted these habits, and several cities now have markets in which clothes are swapped rather than sold. However, critics point out that individual choices cannot replace stricter regulation of the industry.",
  q:[
    ["True, False, or Not given: Some retailers introduce new collections every week.",["True","False","Not given"],0],
    ["True, False, or Not given: Consumers today buy fewer garments than they did two decades ago.",["True","False","Not given"],1],
    ["True, False, or Not given: Cotton farmers in India earn less than farmers of any other crop.",["True","False","Not given"],2],
    ["What does the writer say about the 2013 factory collapse?",["It drew international attention to working conditions","It ended fast fashion","It happened in Europe","It was caused by a fire"],0],
    ["What do critics say about individual choices?",["They cannot replace stricter regulation","They are the only solution","They are harmful","They are too expensive"],0]
  ]},
{ id:"s50", lv:5, title:"Learning in the Age of Artificial Intelligence",
  text:"Few technologies have entered classrooms as rapidly as artificial intelligence. Within a short period, students gained access to tools that can summarise a chapter, correct an essay and even write one from scratch. Teachers, who were largely unprepared, responded in contrasting ways. Some banned the tools completely, while others began to integrate them into their lessons.\n\nSupporters of AI in education emphasise its potential for personalised learning. A system can adapt the difficulty of exercises to each student, provide immediate feedback and explain a concept as many times as necessary without losing patience. For students in remote areas or in under-resourced schools, such support could narrow the gap between them and their more fortunate peers.\n\nCritics, however, raise several concerns. If students depend on the tool to produce their answers, they may fail to develop the ability to think independently. There are also doubts about accuracy, since AI systems sometimes present incorrect information with great confidence. Finally, questions of privacy arise when the data of young learners are collected and stored by private companies.\n\nMost educators now accept that a total ban is unrealistic, and the debate has shifted towards how the tools should be used. Some schools ask students to submit their drafts and notes along with the final work, in order to show how their ideas developed. Others design assignments that require personal experience or classroom discussion, which a machine cannot easily imitate. What matters, many argue, is not whether students use AI, but whether they still understand what they submit.",
  q:[
    ["True, False, or Not given: All teachers reacted to AI tools in the same way.",["True","False","Not given"],1],
    ["True, False, or Not given: AI can adapt the difficulty of exercises to each student.",["True","False","Not given"],0],
    ["True, False, or Not given: Most students in the world use AI every day.",["True","False","Not given"],2],
    ["Which concern do critics raise?",["Students may not learn to think independently","AI is too slow","Teachers will earn less","Schools will have no computers"],0],
    ["What do some schools ask students to submit?",["Drafts and notes with the final work","Only the final answer","A video of the lesson","A letter from their parents"],0]
  ]},
{ id:"s51", lv:5, title:"The Economics of Public Transport",
  text:"Public transport is often described as a service that cities should provide for the common good, yet it is also an enterprise that requires considerable funding. In very few cities do fares cover the full cost of operating a bus or metro system. The remainder is usually paid from taxes, which raises an important question: who should pay for a service that not everyone uses?\n\nAdvocates of subsidies argue that the benefits of public transport extend beyond its passengers. Fewer cars on the road mean less congestion, cleaner air and fewer accidents, all of which benefit the entire community. Moreover, an affordable transport system gives low-income residents access to jobs and education, which would otherwise be out of reach. From this perspective, subsidies are an investment rather than an expense.\n\nOpponents reply that subsidies can encourage inefficiency. If a company is guaranteed to receive public money, it may have little incentive to control costs or improve its service. They also point out that in some cities, the poorest residents live in areas that the metro does not reach, so they may be paying for a service that they cannot use.\n\nSeveral cities have tried to find a balance. Singapore, for example, combines congestion charges for private vehicles with a highly developed public network, using the revenue from the first to support the second. Whether such a model can be copied elsewhere depends on a number of factors, including population density, the strength of institutions and, not least, the willingness of citizens to change their habits.",
  q:[
    ["True, False, or Not given: Fares cover the full cost in most cities.",["True","False","Not given"],1],
    ["True, False, or Not given: Singapore uses congestion charges to support its public network.",["True","False","Not given"],0],
    ["True, False, or Not given: The metro in Jakarta is the busiest in South-East Asia.",["True","False","Not given"],2],
    ["Why do advocates of subsidies see them as an investment?",["Benefits such as cleaner air and access to jobs extend to everyone","They make fares higher","They reduce taxes","They remove all private cars"],0],
    ["What is the opponents' concern about subsidies?",["They can reduce the incentive to control costs","They make buses too fast","They are illegal","They only help the rich"],0]
  ]}
);

{ id:"g70", lv:4, title:"Perbandingan lanjutan: than ever, than it has been",
  ringkas:"Selain pola dasar more ... than, ada bentuk perbandingan yang sering muncul di teks bacaan: membandingkan keadaan sekarang dengan masa lalu atau dengan semua waktu sebelumnya. Kata kerja bantu (has, was, is) diulang tanpa mengulang kata sifatnya.",
  rumus:["than ever (before) = daripada sebelumnya: Prices are higher than ever.","than + subjek + kata kerja bantu: more accessible now than it ever has been / than it has ever been.","Masa lalu tertentu pakai was: safer than it was five years ago.","Seberapa besar bedanya: much / far / a lot / slightly + bentuk comparative.","The + comparative, the + comparative: The more we practise, the better we become.","Makin lama makin: comparative + and + comparative: cheaper and cheaper.","Tidak sama: not as + kata sifat + as; less + kata sifat + than."],
  contoh:[["Solar power is more accessible now than it ever has been.","Tenaga surya sekarang lebih mudah dijangkau daripada sebelumnya."],["Our plant is safer than it was five years ago.","Pembangkit kita lebih aman daripada lima tahun lalu."],["The more you practise, the more confident you become.","Makin banyak kamu berlatih, makin percaya diri kamu."],["The exam was much harder than we expected.","Ujiannya jauh lebih sulit daripada yang kami kira."]],
  tips:"Tiga kesalahan umum: more better (salah, cukup better), very harder (salah, pakai much harder), dan than it ever been (kurang has). Kalau kalimat utama memakai is, bentuk pasangannya biasanya has been atau was; pilih sesuai waktu yang dibandingkan. Than it has ever been dan than it ever has been sama-sama benar.",
  latihan:[
    ["Solar power is more accessible now than it ever ___ been.",["has","is","did","does"],0],
    ["Prices are higher than ___.",["ever","never","always","ever before than"],0],
    ["The plant is safer today than it ___ five years ago.",["was","has been","is","does"],0],

    ["Our electricity bill is getting ___.",["higher and higher","high and high","more high","the highest and"],0],

    ["Learning English is easier now than it ___ been.",["has ever","ever","is ever","was ever"],0],
    ["The ___ the weather became, the more the work was delayed.",["worse","worst","badly","more bad"],0]
  ]}

{ id:"g71", lv:1, title:"Perintah dan larangan (Do, Don't, Please, Let's)",

{ id:"g72", lv:1, title:"Jam dan tanggal",
  ringkas:"Cara menyebut jam dan tanggal dalam bahasa Inggris. Jam memakai at, tanggal dan hari memakai on, bulan dan tahun memakai in.",
  rumus:["Jam pas: It is six o'clock. Setengah: half past six (06.30).","Lewat: ten past six (06.10), a quarter past six (06.15).","Kurang: ten to seven (06.50), a quarter to seven (06.45).","at + jam, on + tanggal atau hari, in + bulan atau tahun.","Tanggal memakai angka urutan: 5 May dibaca the fifth of May, 21 June dibaca the twenty-first of June."],
  contoh:[["The meeting starts at half past eight.","Rapatnya mulai pukul delapan tiga puluh."],["The shift ends at a quarter to three.","Shiftnya selesai pukul tiga kurang seperempat."],["My birthday is on the twelfth of March.","Ulang tahun saya tanggal dua belas Maret."],["The plant started in 2019.","Pembangkit itu mulai beroperasi tahun 2019."]],
  tips:"Past (lewat) dipakai sampai menit ke-30, to (kurang) dipakai setelah itu. Pukul 7.45 adalah a quarter to eight, bukan a quarter past seven.",

{ id:"g73", lv:2, title:"Countable dan uncountable (equipment, information, advice)",
  ringkas:"Kata benda yang bisa dihitung (a pump, two pumps) dan yang tidak bisa dihitung (water, equipment, information) diperlakukan berbeda. Kata tak terhitung tidak memakai a/an dan tidak memakai bentuk jamak.",
  rumus:["Terhitung: a/an, one, two, many, a few, fewer. a pump, many pumps.","Tak terhitung: tanpa a/an, tanpa -s. water, oil, information, equipment, advice, news, work, electricity.","much, a little, less dipakai dengan tak terhitung.","Menghitung tak terhitung: a piece of advice, a bottle of water, an item of equipment.","Kata kerjanya tunggal: The information is useful. The equipment is new."],
  contoh:[["We have many pumps but little spare equipment.","Kami punya banyak pompa tetapi sedikit peralatan cadangan."],["Can you give me some advice?","Bisa kasih saya saran?"],["The news is good.","Beritanya bagus."],["I need a piece of information.","Saya butuh satu informasi."]],
  tips:"Equipment, information, advice, news, furniture, dan luggage tak terhitung dalam bahasa Inggris, walaupun bahasa Indonesianya bisa dihitung. Jangan tulis equipments, informations, atau advices.",
  latihan:[

{ id:"g74", lv:2, title:"Kata kerja tak beraturan (go, went, gone)",
  ringkas:"Banyak kata kerja punya bentuk lampau (V2) dan bentuk ketiga (V3) yang tidak berakhiran -ed. Bentuk ini harus dihafal. V2 dipakai untuk simple past, V3 untuk present perfect dan kalimat pasif.",

  tips:"Pakai V2 tanpa has atau have untuk kejadian dengan waktu lampau yang jelas: I saw him yesterday. Pakai V3 setelah has, have, had atau di kalimat pasif: I have seen him. Jangan tertukar: I have went dan I seen him sama-sama salah.",

{ id:"g75", lv:2, title:"Tujuan: to, in order to, so that, for",
  ringkas:"Untuk menjelaskan tujuan melakukan sesuatu, bahasa Inggris punya beberapa pola: to + kata kerja, in order to + kata kerja, so that + klausa, dan for + kata benda atau V-ing.",
  rumus:["to + kata kerja dasar: I called to ask about the delivery.","in order to + kata kerja dasar (lebih formal): We stopped the unit in order to repair it.","so that + subjek + kata kerja (sering dengan can, will): Speak slowly so that everyone can understand.","for + kata benda: I went there for a meeting.","for + V-ing untuk fungsi alat: This gauge is used for measuring pressure."],
  contoh:[["I called the supplier to ask about the delivery.","Saya menelepon pemasok untuk menanyakan pengiriman."],["We shut down the unit in order to repair the pump.","Kami mematikan unit untuk memperbaiki pompa."],["Speak slowly so that everyone can understand.","Bicaralah pelan supaya semua orang bisa mengerti."],["This gauge is used for measuring pressure.","Alat ukur ini dipakai untuk mengukur tekanan."]],
  tips:"Jangan pakai for + kata kerja dasar untuk tujuan: I went there for meet him itu salah, yang benar to meet him. Setelah so that ada subjek baru dan biasanya modal: can, will, could, would.",

{ id:"g76", lv:2, title:"Present simple atau present continuous?",
  ringkas:"Present simple untuk kebiasaan dan fakta. Present continuous untuk kejadian yang sedang berlangsung atau sementara. Kata kerja keadaan seperti know, like, want, dan need jarang dipakai dengan -ing.",
  rumus:["Present simple: kebiasaan dan fakta. I check the pumps every day.","Present continuous: sedang terjadi. I am checking the pump now.","Penanda simple: every day, usually, always, often.","Penanda continuous: now, at the moment, today, these days, currently.","Kata kerja keadaan (know, like, want, need, understand, believe) tidak memakai -ing: I know the answer."],
  contoh:[["I usually take the bus, but today I am driving.","Biasanya saya naik bus, tetapi hari ini saya menyetir."],["Water boils at 100 degrees.","Air mendidih pada 100 derajat."],["The engineers are testing the new system.","Para insinyur sedang menguji sistem baru."],["I need more time.","Saya butuh lebih banyak waktu."]],
  tips:"Kalau ada kata Look!, now, atau at the moment, hampir pasti present continuous. Kalau ada every day, usually, atau always, hampir pasti present simple. Jangan tulis I am knowing atau I am needing.",
  latihan:[
    ["He usually ___ at six o'clock.",["gets up","is getting up","get up","getting up"],0],
    ["Look! The pump ___ a strange noise.",["is making","makes","make","making"],0],
    ["I ___ the answer. It is 24.",["know","am knowing","knowing","knows"],0],
    ["Water ___ at 100 degrees Celsius.",["boils","is boiling","boil","boiling"],0],
    ["Please be quiet. The manager ___ on the phone.",["is talking","talks","talk","talking"],0],
    ["We ___ lunch at noon every day.",["have","are having","has","having"],0],

    ["___ you understand the instruction?",["Do","Are","Does","Is"],0],
    ["The sun ___ in the east.",["rises","is rising","rise","rising"],0]
  ]},
{ id:"g77", lv:2, title:"Can, could, be able to, dan permintaan sopan",
  ringkas:"Can dan could menyatakan kemampuan. Could, would you mind, dan may membuat permintaan terdengar sopan. Shall I dan Shall we dipakai untuk menawarkan bantuan atau mengajak.",
  rumus:["can + kata kerja dasar: kemampuan sekarang atau izin. I can fix this.","could + kata kerja dasar: kemampuan masa lalu, atau permintaan sopan. Could you help me?","be able to: pengganti can di tense lain. I will be able to start tomorrow.","Would you mind + V-ing? Would you mind closing the door?","Shall I / Shall we + kata kerja dasar: tawaran atau ajakan. Shall I help you?","Can I / May I + kata kerja dasar: minta izin. May I come in?"],
  contoh:[["Could you send me the file, please?","Bisa tolong kirim filenya?"],["She can speak three languages.","Dia bisa berbicara tiga bahasa."],["Would you mind opening the window?","Maukah kamu membuka jendela?"],["Shall I carry the tools?","Mau saya bawakan alatnya?"]],
  tips:"Setelah can, could, dan shall tidak ada to dan tidak ada -s: She can help, bukan She cans to help. Would you mind selalu diikuti V-ing. Untuk masa depan atau perfect, pakai be able to, bukan can.",
  latihan:[

    ["He ___ come to work yesterday because he was sick.",["couldn't","can't","isn't able","won't able"],0],

    ["Shall we ___ now?",["start","starting","to start","started"],0]
  ]},
{ id:"g78", lv:3, title:"Klausa waktu: when, while, as soon as, until",
  ringkas:"Di klausa waktu untuk masa depan, pakai present simple, bukan will. Kata penghubung waktu: when, as soon as, before, after, until, while.",
  rumus:["when / as soon as / before / after / until + present simple (untuk masa depan).","Klausa utama pakai will: I will call you when I arrive.","while: dua hal berlangsung bersamaan. Do not talk while you are driving.","until: sampai. Wait here until I come back.","by the time + present simple: By the time you arrive, we will have finished."],
  contoh:[["I will call you when I arrive at the site.","Saya akan menelepon kamu saat tiba di lokasi."],["Wait here until the supervisor comes back.","Tunggu di sini sampai supervisor kembali."],["As soon as the alarm sounds, leave the area.","Begitu alarm berbunyi, tinggalkan area."],["Do not use your phone while you are driving.","Jangan pakai ponsel saat menyetir."]],
  tips:"Jangan pakai will di klausa waktu: When I will finish itu salah, yang benar When I finish. Gunakan while untuk dua kegiatan yang berjalan bersamaan, dan during untuk kata benda (during the meeting).",

{ id:"g79", lv:3, title:"Pertanyaan Who dan What sebagai subjek atau objek",
  ringkas:"Kalau who atau what adalah pelaku kalimat (subjek), kalimat tanya tidak memakai do, does, atau did. Kalau who atau what adalah objek, pakai do, does, atau did. Preposisi biasanya diletakkan di akhir.",
  rumus:["Subjek: Who called you? (tanpa did)","Objek: Who did you call? (pakai did)","What happened? (tanpa did). What did you do? (pakai did)","Preposisi di akhir: Who are you waiting for? What is it made of?","Which + kata benda sebagai subjek: Which engineer repaired the pump?"],
  contoh:[["Who called you this morning?","Siapa yang menelepon kamu pagi ini?"],["Who did you call this morning?","Siapa yang kamu telepon pagi ini?"],["What happened to the pump?","Apa yang terjadi pada pompa itu?"],["Who are you waiting for?","Kamu menunggu siapa?"]],
  tips:"Cara cek: ubah dulu jadi pernyataan. Someone called you menjadi Who called you. You called someone menjadi Who did you call. Jangan tulis Who did called atau What did happened.",
  latihan:[
    ["Who ___ the report yesterday?",["wrote","did wrote","does wrote","was wrote"],0],

{ id:"g80", lv:3, title:"Each, every, all, both, either, neither, another, other",
  ringkas:"Kata penentu jumlah ini sering membingungkan karena ada yang diikuti kata benda tunggal dan ada yang jamak. Another dan other juga dipakai berbeda.",
  rumus:["every / each + kata benda tunggal + kata kerja tunggal: Every worker has a helmet.","all + jamak atau tak terhitung: all workers, all water.","both + dua + jamak: Both pumps are broken.","either = salah satu dari dua, neither = tak satu pun dari dua: Neither pump is working.","another + tunggal (satu lagi): another pen.","other + jamak: other pumps. the other(s) = sisanya yang tertentu."],
  contoh:[["Every worker has a helmet.","Setiap pekerja punya helm."],["Both pumps are broken.","Kedua pompa rusak."],["Neither of the engineers is free.","Tak satu pun insinyur itu senggang."],["Some pumps are new. Others are old.","Sebagian pompa baru. Yang lain sudah tua."]],
  tips:"Every, each, either, dan neither diikuti kata benda tunggal dan kata kerja tunggal. Both selalu jamak. Another sudah berisi kata an, jadi tidak ditulis an other.",

{ id:"g81", lv:3, title:"Reflexive (myself) dan kepemilikan",
  ringkas:"Kata ganti reflexive (myself, himself, dan seterusnya) dipakai ketika pelaku dan penerima perbuatan adalah orang yang sama. Kepemilikan dinyatakan dengan 's, of, whose, dan mine/yours.",
  rumus:["myself, yourself, himself, herself, itself, ourselves, themselves.","Pelaku = penerima: He cut himself.","by + reflexive = sendirian: I did it by myself.","each other = saling: They help each other.","'s untuk orang, of untuk benda: the manager's office, the end of the shift.","mine, yours, his, hers, ours, theirs berdiri sendiri: This helmet is mine.","Whose helmet is this?"],
  contoh:[["He cut himself with a knife.","Dia terpotong pisau."],["I repaired the pump by myself.","Saya memperbaiki pompanya sendiri."],["The two engineers help each other.","Kedua insinyur itu saling membantu."],["This helmet is not yours. It is mine.","Helm ini bukan punyamu. Ini punyaku."]],
  tips:"Myself bukan pengganti I. Jangan tulis Myself and my friend went. Dan jangan pakai my sendirian untuk menggantikan benda: This is my, salah. Yang benar This is mine.",

// ===== IELTS Writing Task 1: grafik dan diagram =====
(function(){
const INK="#1F2D3A",GRID="#C9D3DA",MUT="#5A6B78";
const T=(x,y,t,sz,f,a)=>Tx(x,y,t,sz||7,f||INK,a);
const Ln=(x1,y1,x2,y2,c,w,extra)=>'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+(w||1)+'"'+(extra||'')+'/>';
const BG=R(0,0,320,200,"#FFFFFF");
function arrow(x1,y1,x2,y2){
  const a=Math.atan2(y2-y1,x2-x1),h=5;
  const p1=[x2-h*Math.cos(a-0.5),y2-h*Math.sin(a-0.5)],p2=[x2-h*Math.cos(a+0.5),y2-h*Math.sin(a+0.5)];
  return Ln(x1,y1,x2,y2,INK,1.6)+'<polygon points="'+x2+','+y2+' '+p1[0].toFixed(1)+','+p1[1].toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1)+'" fill="'+INK+'"/>';
}

/* bar chart: penggunaan internet harian menurut usia */
function barSvg(){
  const cats=["16-24","25-44","45-64","65+"],a=[88,80,55,18],b=[98,95,82,52];
  const y0=162,sc=1.2; // 100% = 120px
  let s=BG+T(160,13,"Daily internet users by age group (%)",9);
  s+=R(78,19,8,8,"#5B8BBF")+T(90,26,"2010",7,INK,"start")+R(120,19,8,8,"#E8913A")+T(132,26,"2020",7,INK,"start");
  [0,25,50,75,100].forEach(v=>{const y=y0-v*sc;s+=Ln(36,y,306,y,GRID,.8)+T(32,y+2.5,v,7,MUT,"end")});
  cats.forEach((c,i)=>{
    const x=48+i*65;
    s+=R(x,y0-a[i]*sc,24,a[i]*sc,"#5B8BBF")+R(x+26,y0-b[i]*sc,24,b[i]*sc,"#E8913A");
    s+=T(x+12,y0-a[i]*sc-3,a[i],6.5)+T(x+38,y0-b[i]*sc-3,b[i],6.5)+T(x+25,y0+12,c,8);
  });
  s+=Ln(36,y0,306,y0,INK,1.4)+T(171,y0+25,"Age group",7,MUT);
  return svg(s);
}

/* line graph: sumber listrik 2000-2020 */
function lineSvg(){
  const yrs=[2000,2005,2010,2015,2020],coal=[60,55,45,30,20],ren=[5,10,20,35,50],gas=[35,35,35,35,30];
  const x=i=>50+i*62,y0=160,sc=2;
  let s=BG+T(160,13,"Electricity generation by source (%)",9);
  s+=Ln(104,23,116,23,"#444",2.5)+T(119,26,"Coal",7,INK,"start")+Ln(152,23,164,23,"#2B8A57",2.5)+T(167,26,"Renewables",7,INK,"start")+Ln(222,23,234,23,"#C98F00",2.5)+T(237,26,"Gas",7,INK,"start");
  [0,20,40,60].forEach(v=>{const y=y0-v*sc;s+=Ln(40,y,300,y,GRID,.8)+T(36,y+2.5,v,7,MUT,"end")});
  const pl=(arr,c)=>'<polyline fill="none" stroke="'+c+'" stroke-width="2.4" stroke-linejoin="round" points="'+arr.map((v,i)=>x(i)+","+(y0-v*sc)).join(" ")+'"/>'+arr.map((v,i)=>Ci(x(i),y0-v*sc,3,c)).join('');
  s+=pl(coal,"#444")+pl(ren,"#2B8A57")+pl(gas,"#C98F00");
  coal.forEach((v,i)=>{if(i%2===0||i===4)s+=T(x(i),y0-v*sc-6,v,6.5,"#444")});
  ren.forEach((v,i)=>{if(i%2===0||i===4)s+=T(x(i),y0-v*sc+(v<12?-7:12),v,6.5,"#1F6B43")});
  yrs.forEach((v,i)=>{s+=T(x(i),y0+12,v,7.5)});
  s+=Ln(40,y0,300,y0,INK,1.4)+T(170,y0+25,"Year",7,MUT);
  return svg(s);
}

/* pie chart: pengeluaran keluarga */
function pieSvg(){
  const parts=[["Housing",35,"#5B8BBF"],["Food",25,"#E8913A"],["Transport",15,"#2B8A57"],["Education",10,"#A8386E"],["Entertainment",10,"#C98F00"],["Savings",5,"#7A8794"]];
  const cx=92,cy=112,r=64;let a0=0,s=BG+T(160,13,"How a family spends its monthly income",9);
  parts.forEach(p=>{
    const a1=a0+p[1]/100*Math.PI*2,x0=cx+r*Math.sin(a0),y0=cy-r*Math.cos(a0),x1=cx+r*Math.sin(a1),y1=cy-r*Math.cos(a1);
    s+='<path d="M'+cx+' '+cy+' L'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+r+' '+r+' 0 '+(a1-a0>Math.PI?1:0)+' 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+' Z" fill="'+p[2]+'" stroke="#fff" stroke-width="1.5"/>';
    if(p[1]>=10){const m=(a0+a1)/2;s+=T(cx+r*.66*Math.sin(m),cy-r*.66*Math.cos(m)+3,p[1]+"%",8,"#fff")}
    a0=a1;
  });
  parts.forEach((p,i)=>{s+=R(184,40+i*22,10,10,p[2],2)+T(200,49+i*22,p[0]+" "+p[1]+"%",8,INK,"start")});
  return svg(s);
}

/* diagram proses: daur ulang botol plastik */
function processSvg(){
  const bx=(x,y,n,t1,t2,c)=>R(x,y,84,44,c,6)+Ci(x+10,y+10,8,"#fff")+T(x+10,y+13,n,9,INK)+T(x+46,y+22,t1,8,"#fff")+T(x+46,y+33,t2||"",8,"#fff");
  let s=BG+T(160,15,"Recycling plastic bottles",9);
  s+=bx(10,40,1,"Bottles are","collected","#5B8BBF")+bx(118,40,2,"Plastic is","sorted","#2B8A57")+bx(226,40,3,"Bottles are","cleaned","#C98F00");
  s+=bx(226,128,4,"Plastic is","melted","#C0412E")+bx(118,128,5,"New products","are made","#A8386E");
  s+=arrow(95,62,116,62)+arrow(203,62,224,62)+arrow(268,86,268,126)+arrow(224,150,203,150);
  s+=T(160,190,"Final product: clothes, bags, new bottles",7.5,MUT);
  return svg(s);
}

<script>

/* ---------- ikon ---------- */

function ringSvg(p,r,w){const c=2*Math.PI*r,o=c*(1-Math.max(0,Math.min(1,p)));return'<svg viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="'+r+'" fill="none" stroke-width="'+w+'"/><circle class="pr" cx="50" cy="50" r="'+r+'" fill="none" stroke-width="'+w+'" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+o.toFixed(1)+'"/></svg>'}

let ST={level:0,dark:null,rate:0.9,saved:[],custom:[],known:{},miss:{},stats:{},caps:{},goal:20,sound:false,best:{},day:{d:"",n:0},streak:{last:"",n:0}};

/* ---------- data ---------- */
const W=[];
[1,2,3,4,5].forEach(lv=>V[lv].forEach((r,i)=>W.push({k:lv+"-"+i,lv:lv,en:r[0],m:r[1],pos:r[2],ex:r[3],xi:r[4],cat:r[5],f:r[6]||r[0]})));
const LK={};W.forEach(w=>{LK[w.en.toLowerCase()]=w;LK[w.f.toLowerCase()]=w});
function lookup(tok){
  tok=tok.toLowerCase();if(LK[tok])return LK[tok];
  const c=[tok.replace(/s$/,""),tok.replace(/es$/,""),tok.replace(/ed$/,""),tok.replace(/d$/,""),tok.replace(/ing$/,""),tok.replace(/ing$/,"e")];
  for(let i=0;i<c.length;i++)if(c[i]!==tok&&LK[c[i]])return LK[c[i]];
  return null;
}
const byLv=a=>ST.level?a.filter(x=>x.lv===ST.level):a.filter(x=>x.lv<=4);

const lvHead=(lv,n)=>'<div class="lvh l'+lv+'"><i></i>'+LVN[lv]+' <small>'+n+'</small></div>';
const badge=lv=>'<span class="badge l'+lv+'">'+(lv===5?'IELTS':'Level '+lv)+'</span>';
const bestBadge=k=>ST.best[k]!=null?'<span class="badge gold">Terbaik '+ST.best[k]+'%</span>':'';

/* ---------- suara + efek ---------- */
let VOICE=null,sayTok=0;
function pickVoice(){try{const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}
if("speechSynthesis" in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function say(text,done,mul){
  if(!("speechSynthesis" in window)){toast("Perangkat ini tidak punya suara bawaan.");return}
  const tok=++sayTok;try{speechSynthesis.cancel()}catch(e){}
  const parts=(text.match(/[^.!?]+[.!?]*/g)||[text]).map(s=>s.trim()).filter(Boolean);
  let i=0;
  const next=()=>{
    if(tok!==sayTok)return;
    if(i>=parts.length){done&&done();return}
    const u=new SpeechSynthesisUtterance(parts[i++]);
    u.lang="en-US";if(VOICE)u.voice=VOICE;u.rate=Math.max(0.4,ST.rate*(mul||1));
    u.onend=next;u.onerror=next;
    speechSynthesis.speak(u);
  };
  setTimeout(next,60);
}
function stopSay(){sayTok++;try{speechSynthesis.cancel()}catch(e){}}
let AC=null;
function tone(f,t,d,type,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(v||0.11,n+0.01);g.gain.exponentialRampToValueAtTime(0.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+0.03)}catch(e){}}
function sfx(k){if(!ST.sound)return;if(k==="ok"){tone(660,0,.12);tone(880,.1,.18)}else if(k==="bad"){tone(190,0,.24,"triangle",.14)}else{[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.22))}}
function confetti(){
  const cols=["#F2B53A","#0B7A75","#C0412E","#3659B8","#2B8A57","#A8386E"];
  for(let i=0;i<46;i++){const d=document.createElement("i");d.className="conf";d.style.left=Math.random()*100+"vw";d.style.background=cols[i%cols.length];d.style.animationDelay=(Math.random()*.5)+"s";d.style.animationDuration=(1.5+Math.random()*1.2)+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),3400)}
}

/* ---------- toast + sheet + popover ---------- */
let toastT=null;
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display="none"},2400)}
function openSheet(html){$("#sheet").innerHTML=html;$("#sheet").classList.add("open");$("#shade").classList.add("open")}
function closeSheet(){$("#sheet").classList.remove("open");$("#shade").classList.remove("open")}
$("#shade").addEventListener("click",closeSheet);
let POP=null;
function closePop(){const p=$("#pop");if(p)p.remove();POP=null}
document.addEventListener("click",e=>{if(POP!==null&&!e.target.closest("#pop")&&!e.target.closest(".blank"))closePop()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closePop();closeSheet()}});

/* ---------- router ---------- */
const VIEWS={};
let NAV=[{v:"home",p:{}}],pushed=0;
function go(v,p){
  stopSay();NAV.push({v:v,p:p||{}});

  render();
}
function popNav(){if(NAV.length>1){stopSay();NAV.pop();render()}}
function back(){if(pushed>0){history.back()}else popNav()}
window.addEventListener("popstate",()=>{if(pushed>0)pushed--;popNav()});
function render(keepScroll){
  closePop();
  const c=NAV[NAV.length-1];const r=VIEWS[c.v](c.p||{});

  $("#back").hidden=NAV.length<2;
  $("#lvtxt").textContent=LVN[ST.level];$("#lvchip").firstElementChild.style.background=LVC[ST.level];

}
const refresh=()=>render(true);
$("#back").addEventListener("click",back);
$("#lvchip").addEventListener("click",()=>{
  let h='<h2>Pilih level</h2><div class="stack">';
  [0,1,2,3,4,5].forEach(l=>{h+='<button class="item" data-act="setlv" data-v="'+l+'"><span style="width:12px;height:12px;border-radius:4px;background:'+LVC[l]+';flex:none"></span><div class="grow"><b>'+LVN[l]+'</b><span class="muted small">'+(l?LVD[l]:"Semua soal dicampur dari level 1 sampai 4. IELTS dipilih terpisah.")+'</span></div>'+(ST.level===l?'<span class="badge gold">Dipakai</span>':'')+'</button>'});

/* ---------- event delegation ---------- */
const acts={},inputs={};
function deleg(e){const t=e.target.closest("[data-act]");if(t&&acts[t.dataset.act])acts[t.dataset.act](t,e)}

acts.setlv=t=>{ST.level=+t.dataset.v;VS.lv=ST.level;save();closeSheet();refresh()};

acts.go=t=>go(t.dataset.v,t.dataset.p?JSON.parse(t.dataset.p):{});

/* ---------- beranda ---------- */
function lampOf(key){
  if(key==="vocab"){const L=byLv(W),k=L.filter(w=>ST.known[w.k]).length;return{s:k>=30?"ok":k>0?"on":"",t:k+" dari "+L.length+" kata dikuasai",p:k/L.length}}
  if(key==="saved"){const k=allSaved().length;return{s:k>=10?"ok":k>0?"on":"",t:k+" kata tersimpan",p:Math.min(1,k/20)}}

  const s=ST.stats[key]||{done:0,right:0};const p=s.done?Math.round(s.right/s.done*100):0;
  return{s:(s.done>=15&&p>=70)?"ok":s.done>0?"on":"",t:s.done?s.done+" soal, "+p+"% benar":"Belum mulai",p:Math.min(1,s.done/60)};

const TILES=[["vocab","Kosakata","Kuis pilih arti, per level, dan daftar kata"],["fill","Lengkapi kalimat","Pilih kata yang pas untuk bagian kosong"],["gram","Grammar","Materi ringkas dan latihan soal"],["read","Baca cerita","Cerita pendek dan soal pemahaman"],["cloze","Isi kotak","Paragraf rumpang, kosakata dan grammar"],["listen","Dengar","Kalimat, situasi, cerita, dan dikte"],["cap","Caption gambar","Tulis kalimat dari gambar"],["saved","Kata saya","Kata simpanan dan kata buatan sendiri"]];

  h+='</div><h3>Pengaturan</h3><div class="box stack"><div><div class="small muted">Target latihan per hari</div><div class="chips">'+[10,20,40].map(r=>'<button class="chip" data-act="goal" data-v="'+r+'" aria-pressed="'+(ST.goal===r)+'">'+r+' soal</button>').join('')+'</div></div>';
  h+='<div><div class="small muted">Kecepatan suara</div><div class="chips">'+[[0.75,"Pelan"],[0.9,"Normal"],[1.05,"Cepat"]].map(r=>'<button class="chip" data-act="rate" data-v="'+r[0]+'" aria-pressed="'+(ST.rate===r[0])+'">'+r[1]+'</button>').join('')+'<button class="chip" data-act="vtest">Tes suara</button></div></div>';
  h+='<div><div class="small muted">Tampilan</div><div class="chips">'+[[null,"Otomatis"],[false,"Terang"],[true,"Gelap"]].map(r=>'<button class="chip" data-act="theme" data-v="'+r[0]+'" aria-pressed="'+(ST.dark===r[0])+'">'+r[1]+'</button>').join('')+'</div></div>';
  h+='<div><div class="small muted">Efek bunyi saat menjawab</div><div class="chips"><button class="chip" data-act="sound" aria-pressed="'+ST.sound+'">'+(ST.sound?"Nyala":"Mati")+'</button></div></div>';
  h+='<div><button class="btn sm" data-act="reset">Reset semua progres</button></div></div>';
  h+='<p class="muted small" style="margin-top:14px">Suara memakai suara bahasa Inggris bawaan HP atau laptop. Kalau tidak keluar, pasang paket suara English di pengaturan Text-to-Speech. Progres tersimpan di browser perangkat ini saja.</p>';

acts.goal=t=>{ST.goal=+t.dataset.v;save();refresh()};

/* ---------- mesin kuis ---------- */
let Q=null;
function prep(it){if(it.opts[0]==="True"&&it.opts[1]==="False")return Object.assign({},it);const o=it.opts.map((t,i)=>({t:t,c:i===it.a}));const s=shuffle(o);return Object.assign({},it,{opts:s.map(x=>x.t),a:s.findIndex(x=>x.c)})}
function startQuiz(o,replace){
  if(!o)return;
  Q=Object.assign({},o,{i:0,right:0,wrong:[],answered:false,pick:-1,played:-1,res:[],combo:0,maxCombo:0,fin:false,items:o.items.map(prep)});
  if(replace){NAV[NAV.length-1]={v:"quiz",p:{}};render()}else go("quiz");
}
VIEWS.quiz=function(){
  if(!Q)return{title:"Kuis",html:'<p>Tidak ada kuis aktif.</p>'};
  const n=Q.items.length;
  if(Q.i>=n)return{title:Q.title,html:resultHtml(),after:resultAfter};
  const it=Q.items[Q.i];
  let seg="";for(let i=0;i<n;i++){const r=Q.res[i];seg+='<i class="'+(r?r:(i===Q.i?"now":""))+'"></i>'}
  let h='<div class="seg">'+seg+'</div><div class="qmeta"><span class="muted small">Soal '+(Q.i+1)+' dari '+n+'</span>'+(Q.combo>=2?'<span class="combo">'+ic("flame",14)+Q.combo+' beruntun</span>':'')+'</div>';
  if(it.say)h+='<div class="row" style="margin-bottom:12px"><button class="btn primary" data-act="qplay">'+SPK+(it.label||"Putar audio")+'</button><button class="btn" data-act="qslow">Pelan</button></div>';
  h+='<div class="q">'+it.q+'</div>';
  if(it.sub)h+='<p class="hint">'+it.sub+'</p>';
  it.opts.forEach((o,i)=>{let c="opt";if(Q.answered){if(i===it.a)c+=" right";else if(i===Q.pick)c+=" wrong"}h+='<button class="'+c+'" data-act="qpick" data-i="'+i+'"'+(Q.answered?" disabled":"")+'><span class="lt">'+"ABCDEF".charAt(i)+'</span><span class="ot">'+esc(o)+'</span></button>'});
  if(Q.answered){const ok=Q.pick===it.a;h+='<div class="fb'+(ok?"":" bad")+'"><b class="t">'+(ok?"Benar":"Belum tepat")+'</b>'+(it.exp||"")+(it.full?' <button class="btn sm" data-act="say" data-t="'+esc(it.full)+'">'+SPK+'Dengar</button>':"")+'</div><div class="dock"><button class="btn primary wide" data-act="qnext">'+(Q.i+1<n?"Lanjut":"Lihat hasil")+'</button></div>'}
  return{title:Q.title,html:h,after:()=>{if(it.say&&it.auto!==false&&Q.played!==Q.i&&!Q.answered){Q.played=Q.i;setTimeout(()=>say(it.say),250)}if(Q.answered){const d=$(".dock");if(d)d.scrollIntoView({block:"nearest"})}}};
};
function resultHtml(){
  const n=Q.items.length,p=Math.round(Q.right/n*100);

  h+='<div class="pills" style="margin-bottom:6px"><span class="badge">Benar '+Q.right+'</span><span class="badge">Salah '+Q.wrong.length+'</span><span class="badge">Beruntun terbaik '+Q.maxCombo+'</span>'+(Q.newBest?'<span class="badge gold">Rekor baru</span>':(Q.key&&Q.prevBest!=null?'<span class="badge gold">Rekor '+Q.prevBest+'%</span>':''))+'</div>';

  return h;
}
function resultAfter(){const p=Math.round(Q.right/Q.items.length*100);if(p>=80&&!Q.cf){Q.cf=1;confetti()}}
function finishQuiz(){
  const n=Q.items.length,p=Math.round(Q.right/n*100);Q.fin=true;
  if(Q.key){Q.prevBest=ST.best[Q.key];Q.newBest=Q.prevBest==null||p>Q.prevBest;if(Q.newBest)ST.best[Q.key]=p;save()}
  if(p>=80)sfx("win");
}
acts.qplay=()=>{const it=Q.items[Q.i];say(it.say)};
acts.qslow=()=>{const it=Q.items[Q.i];say(it.say,null,0.7)};
acts.qpick=t=>{
  if(Q.answered)return;const it=Q.items[Q.i],i=+t.dataset.i;
  Q.answered=true;Q.pick=i;stopSay();
  const ok=i===it.a;
  if(ok){Q.right++;Q.combo++;Q.maxCombo=Math.max(Q.maxCombo,Q.combo)}else{Q.wrong.push(it);Q.combo=0}
  Q.res[Q.i]=ok?"c":"w";sfx(ok?"ok":"bad");
  if(it.wk){const k=it.wk;if(ok){ST.known[k]=1;const m=ST.miss[k];if(m){m.r=(m.r||0)+1;if(m.r>=2)delete ST.miss[k]}}else{delete ST.known[k];const m=ST.miss[k]||(ST.miss[k]={n:0,r:0});m.n++;m.r=0}}
  const mn=it.menu||Q.menu;if(mn)bump(mn,ok?1:0,1);
  refresh();
};
acts.qnext=()=>{Q.i++;Q.answered=false;Q.pick=-1;if(Q.i>=Q.items.length)finishQuiz();refresh();window.scrollTo(0,0)};
acts.qretry=()=>startQuiz({menu:Q.menu,title:Q.title,items:Q.wrong},true);

document.addEventListener("keydown",e=>{

});

const sense=m=>m.split(";")[0].trim();
const norm=t=>t.toLowerCase().replace(/[^a-z ]/g,"");
const stemId=t=>norm(t.split(";")[0]).split(" ")[0].replace(/^(meng|meny|mem|men|me|ber|per|peng|peny|pem|pen|pe|ter|ke|di|se)/,"");
function dice(a,b){
  const bg=t=>{const r=[];for(let i=0;i<t.length-1;i++)r.push(t.substr(i,2));return r};
  const x=bg(a),y=bg(b);if(!x.length||!y.length)return 0;
  const m={};y.forEach(t=>m[t]=(m[t]||0)+1);let c=0;x.forEach(t=>{if(m[t]>0){c++;m[t]--}});
  return 2*c/(x.length+y.length);
}
const toks=t=>norm(t.replace(/;/g," ")).split(" ").filter(x=>x.length>=4);
W.forEach(w=>{w.cg=dice(norm(w.en),stemId(w.m))>=0.34});
function distract(w,toId){
  const my=toks(w.m);
  let c=W.filter(x=>x!==w&&x.m!==w.m&&x.en!==w.en&&Math.abs(x.lv-w.lv)<=2&&!toks(x.m).some(t=>my.indexOf(t)>=0));
  const same=c.filter(x=>x.pos===w.pos);if(same.length>=15)c=same;
  const ref=toId?norm(w.en):stemId(w.m);
  const sc=c.map(x=>({x:x,s:(x.cg===w.cg?0.6:0)+dice(ref,toId?stemId(x.m):norm(x.en))+Math.random()*0.25}));
  sc.sort((p,q)=>q.s-p.s);
  const seen={},out=[];seen[toId?sense(w.m):w.en]=1;
  for(let i=0;i<sc.length&&out.length<3;i++){const x=sc[i].x,k=toId?sense(x.m):x.en;if(seen[k])continue;seen[k]=1;out.push(x)}
  return out;
}
function vocabMeaningItems(n,pool,dir){
  pool=pool||byLv(W);if(!pool.length)return[];
  return sample(pool,n).map(w=>{
    const back=dir==="mix"?(Math.random()<0.5?"id":"en"):dir||"en";
    const exp='<b class="en">'+esc(w.en)+'</b> = '+esc(w.m)+'<br><span class="en">'+esc(w.ex)+'</span>';
    if(back==="id"){const d=distract(w,false);return{q:'Bahasa Inggrisnya <b>'+esc(w.m)+'</b>?',opts:[w.en].concat(d.map(x=>x.en)),a:0,exp:exp,full:w.ex,menu:"vocab",wk:w.k}}
    const d=distract(w,true);
    return{q:'Apa arti <span class="en">'+esc(w.en)+'</span>?',sub:'<span class="small">'+esc(w.pos)+' &middot; '+(w.lv===5?"IELTS":"Level "+w.lv)+'</span>',say:w.en,auto:false,label:"Dengar kata",opts:[sense(w.m)].concat(d.map(x=>sense(x.m))),a:0,exp:exp,full:w.ex,menu:"vocab",wk:w.k};
  });
}

function wrapWords(text){
  const one=t=>t.split(/([A-Za-z']+)/).map((s,i)=>{
    if(i%2===0)return esc(s);
    const k=lookup(s.replace(/'.*$/,""))?" k":"";
    return '<span class="w'+k+'" data-act="word" data-w="'+esc(s.replace(/'.*$/,""))+'">'+esc(s)+'</span>';
  }).join("");
  const ps=text.split(/\n\n+/);
  return ps.length>1?ps.map(x=>'<p>'+one(x)+'</p>').join(""):one(text);
}

function cls(s){s=s.toLowerCase();if(/ed$/.test(s))return"ed";if(/ing$/.test(s))return"ing";if(/s$/.test(s)&&!/ss$/.test(s))return"s";return"b"}
function vocabFillItem(w){
  const re=new RegExp("\\b"+w.f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
  const m=w.ex.match(re);if(!m)return null;
  const atStart=w.ex.search(re)===0;
  const same=W.filter(x=>x!==w&&x.lv===w.lv);
  let c=same.filter(x=>x.pos===w.pos&&cls(x.f)===cls(w.f)&&x.f.toLowerCase()!==w.f.toLowerCase());
  if(c.length<3)c=c.concat(same.filter(x=>x.pos===w.pos&&c.indexOf(x)<0));
  if(c.length<3)c=c.concat(same.filter(x=>c.indexOf(x)<0));
  const fm=s=>atStart?cap1(s):low1(s);
  const ans=fm(m[0]);
  const opts=[ans].concat(sample(c,3).map(x=>fm(x.f)));
  return{q:'<span class="en">'+esc(w.ex.replace(re,"_____"))+'</span>',sub:FS.tr?esc("Arti "+w.en+": "+w.m):"",opts:opts,a:0,exp:'<span class="en">'+esc(w.ex)+'</span><br>'+esc(w.en)+' = '+esc(w.m),full:w.ex,wk:w.k};
}
function gramItem(g,x){
  const full=x[0].replace("___",x[1][x[2]]);
  return{q:'<span class="en">'+esc(x[0]).replace("___","<b>_____</b>")+'</span>',opts:x[1],a:x[2],exp:'<span class="en">'+esc(full)+'</span><br>Materi: '+esc(g.title),full:full};
}
function gramPool(){const a=[];byLv(G).forEach(g=>g.latihan.forEach(x=>a.push(gramItem(g,x))));return a}
function qFill(){
  let items=[];
  if(FS.src==="vocab"||FS.src==="mix"){const n=FS.src==="mix"?Math.ceil(FS.n/2):FS.n;const pool=shuffle(byLv(W));for(let i=0;i<pool.length&&items.length<n;i++){const it=vocabFillItem(pool[i]);if(it)items.push(it)}}
  if(FS.src==="gram"||FS.src==="mix"){const n=FS.src==="mix"?FS.n-items.length:FS.n;items=items.concat(sample(gramPool(),n))}
  if(!items.length){toast("Tidak ada soal untuk level ini.");return null}
  return{menu:"fill",title:"Lengkapi kalimat",items:shuffle(items),key:"fill-"+FS.src+FS.n+"-"+ST.level,again:qFill};
}
acts.fgo=()=>startQuiz(qFill());

function listenSentItems(n){
  const pool=byLv(W);if(pool.length<4)return[];
  return sample(pool,n).map(w=>{
    const len=w.ex.length;
    const others=W.filter(x=>x!==w&&x.lv===w.lv).sort((a,b)=>Math.abs(a.ex.length-len)-Math.abs(b.ex.length-len)).slice(0,10);
    const d=sample(others,3).map(x=>x.ex);
    return{q:"Kalimat mana yang kamu dengar?",opts:[w.ex].concat(d),a:0,say:w.ex,label:"Putar kalimat",exp:'<span class="en">'+esc(w.ex)+'</span><br>'+esc(xiOf(w)),menu:"listen"};
  });
}
function qDaily(){
  const items=[];let c=0;
  const pool=shuffle(byLv(W));
  for(let i=0;i<pool.length&&c<3;i++){const it=vocabFillItem(pool[i]);if(it){it.menu="fill";items.push(it);c++}}
  sample(gramPool(),3).forEach(it=>{it.menu="gram";items.push(it)});
  vocabMeaningItems(2).forEach(it=>items.push(it));
  listenSentItems(2).forEach(it=>{it.auto=false;items.push(it)});
  if(!items.length){toast("Tidak ada soal untuk level ini.");return null}
  return{menu:"fill",title:"Latihan harian",items:shuffle(items),again:qDaily};
}
acts.daily=()=>startQuiz(qDaily());

function czSetup(c){
  CS.c=c;CS.parts=[];CS.blanks=[];
  c.text.split(/(\{[^}]+\})/).forEach(s=>{
    if(s.charAt(0)==="{"){const a=s.slice(1,-1).split("|");CS.parts.push({b:CS.blanks.length});CS.blanks.push({ans:a[0],ch:a.length>1?shuffle(a):null})}
    else if(s)CS.parts.push({t:s});
  });
  czFresh();
}
function czFresh(){
  CS.fill=CS.blanks.map(()=>"");CS.checked=false;
  CS.bank=shuffle(CS.blanks.filter(b=>!b.ch).map(b=>b.ans).concat(CS.c.x||[]));
  CS.active=Math.max(0,CS.blanks.findIndex(b=>!b.ch));
}
const czOk=i=>CS.fill[i].trim().toLowerCase()===CS.blanks[i].ans.toLowerCase();
acts.czopen=t=>{closePop();czSetup(C.find(x=>x.id===t.dataset.id));go("czplay")};
VIEWS.czplay=function(){
  const gram=CS.c.t==="g";
  let h='<div class="row sb"><span class="kind '+CS.c.t+'">'+(gram?"Grammar":"Kosakata")+'</span><button class="chip" data-act="czmode" aria-pressed="'+CS.hard+'">'+(CS.hard?"Mode ketik":(gram?"Mode pilih":"Pilih dari bank"))+'</button></div>';
  h+='<h2 style="margin-top:10px">'+esc(CS.c.title)+'</h2><p class="hint" style="margin-top:0">'+(CS.hard?"Ketik jawaban di tiap kotak. Bentuk kata harus tepat.":(gram?"Ketuk kotak, lalu pilih bentuk yang paling tepat.":"Ketuk kata di bank untuk mengisi kotak."))+'</p><div class="cloze">';
  CS.parts.forEach(p=>{
    if(p.b===undefined){h+=esc(p.t);return}
    const i=p.b,b=CS.blanks[i];
    const c="blank"+(b.ch?" g":"")+(!CS.checked&&CS.active===i?" active":"")+(CS.checked?(czOk(i)?" right":" wrong"):"");
    if(CS.hard)h+='<input class="'+c+'" data-input="czin" data-i="'+i+'" value="'+esc(CS.fill[i])+'"'+(CS.checked?" disabled":"")+' autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="Kotak '+(i+1)+'">';
    else h+='<button class="'+c+'" data-act="czblank" data-i="'+i+'" aria-label="Kotak '+(i+1)+'"'+(CS.checked?" disabled":"")+'>'+(CS.fill[i]?esc(CS.fill[i]):(b.ch?"pilih &#9662;":"&nbsp;"))+'</button>';
  });
  h+='</div>';
  if(!CS.hard&&!CS.checked&&CS.bank.length){h+='<div class="bank">'+CS.bank.map(w=>'<button class="chip" data-act="czword" data-w="'+esc(w)+'"'+(CS.fill.indexOf(w)>=0?" disabled":"")+'>'+esc(w)+'</button>').join('')+'</div>'}
  if(CS.checked){
    const r=CS.blanks.filter((b,i)=>czOk(i)).length,n=CS.blanks.length;
    const fixed=CS.parts.map(p=>p.b===undefined?esc(p.t):'<b class="cr">'+esc(CS.blanks[p.b].ans)+'</b>').join('');
    h+='<div class="fb'+(r===n?"":" bad")+'"><b class="t">Skor '+r+' dari '+n+'</b>'+(r===n?"Semua benar.":"Kotak merah salah. Teks yang benar ada di bawah.")+'</div>';
    h+='<div class="box"><div class="small muted" style="margin-bottom:6px">Teks yang benar</div><div class="read" style="font-size:1.05rem;line-height:1.8">'+fixed+'</div></div>';
    h+='<div class="dock"><div class="row" style="flex-wrap:nowrap"><button class="btn" data-act="czhear">'+SPK+'Dengar</button><button class="btn" data-act="czretry">Coba lagi</button><button class="btn primary" style="flex:1" data-act="czdone">Selesai</button></div></div>';
  }else{
    const full=CS.fill.every(x=>x.trim());
    h+='<div class="dock"><div class="row" style="flex-wrap:nowrap"><button class="btn primary" style="flex:1" data-act="czcheck"'+(full?"":" disabled")+'>Cek jawaban ('+CS.fill.filter(x=>x.trim()).length+'/'+CS.blanks.length+')</button><button class="btn" data-act="czreset">Kosongkan</button></div></div>';
  }
  return{title:"Isi kotak",html:h};
};
acts.czmode=()=>{CS.hard=!CS.hard;czFresh();refresh()};
function openPop(t,i){
  closePop();POP=i;CS.active=i;
  document.querySelectorAll(".blank.active").forEach(x=>x.classList.remove("active"));t.classList.add("active");
  const el=document.createElement("div");el.id="pop";el.className="pop";el.setAttribute("role","listbox");
  el.innerHTML=CS.blanks[i].ch.map(c=>'<button role="option" data-act="czpick" data-i="'+i+'" data-w="'+esc(c)+'" class="'+(CS.fill[i]===c?"sel":"")+'">'+esc(c)+'</button>').join('');
  el.addEventListener("click",deleg);
  document.body.appendChild(el);
  const r=t.getBoundingClientRect(),pw=el.offsetWidth,ph=el.offsetHeight;
  const left=Math.max(8,Math.min(window.innerWidth-pw-8,r.left+r.width/2-pw/2));
  let top=r.bottom+6;if(top+ph>window.innerHeight-8)top=Math.max(8,r.top-ph-6);
  el.style.left=(left+window.scrollX)+"px";el.style.top=(top+window.scrollY)+"px";
}
acts.czblank=t=>{
  if(CS.checked)return;
  const i=+t.dataset.i,b=CS.blanks[i];
  if(b.ch){if(POP===i){closePop();return}openPop(t,i);return}
  if(CS.fill[i])CS.fill[i]="";CS.active=i;refresh();
};
acts.czpick=t=>{const i=+t.dataset.i;CS.fill[i]=t.dataset.w;closePop();refresh()};
acts.czword=t=>{
  const empty=CS.blanks.map((b,i)=>(!b.ch&&CS.fill[i]==="")?i:-1).filter(i=>i>=0);
  if(!empty.length)return;
  const i=(!CS.blanks[CS.active].ch&&CS.fill[CS.active]==="")?CS.active:empty[0];
  CS.fill[i]=t.dataset.w;const nx=CS.blanks.map((b,k)=>(!b.ch&&CS.fill[k]==="")?k:-1).filter(k=>k>=0);CS.active=nx.length?nx[0]:i;refresh();
};
inputs.czin=t=>{CS.fill[+t.dataset.i]=t.value;const b=$('[data-act="czcheck"]');if(b){b.disabled=!CS.fill.every(x=>x.trim());b.textContent="Cek jawaban ("+CS.fill.filter(x=>x.trim()).length+"/"+CS.blanks.length+")"}};
acts.czreset=()=>{CS.fill=CS.blanks.map(()=>"");CS.active=Math.max(0,CS.blanks.findIndex(b=>!b.ch));refresh()};
acts.czretry=()=>{if(CS.c.t==="g")CS.blanks.forEach(b=>{if(b.ch)b.ch=shuffle(b.ch)});czFresh();refresh();window.scrollTo(0,0)};
acts.czcheck=()=>{
  CS.checked=true;closePop();
  const n=CS.blanks.length,r=CS.blanks.filter((b,i)=>czOk(i)).length;
