  ringkas:"Adjective berakhiran -ed menyatakan perasaan seseorang. Adjective berakhiran -ing menyatakan sifat benda atau situasi yang menimbulkan perasaan itu.",
  rumus:["-ed = perasaan orang: I am bored. She is tired. We were surprised.","-ing = sifat hal: The film is boring. The job is tiring. The news was surprising.","Pasangan umum: interested / interesting, confused / confusing, excited / exciting, frightened / frightening"],
  contoh:[["The meeting was boring.","Rapatnya membosankan."],["I was bored in the meeting.","Saya bosan di rapat itu."],["The instructions are confusing.","Instruksinya membingungkan."]],
  tips:"I am boring berarti saya orang yang membosankan, bukan saya bosan. Kalau maksudnya perasaanmu, pakai -ed: I am bored.",
  latihan:[
    ["The meeting was ___.",["boring","bored","bore","boringly"],0],
    ["I am ___ in this job.",["interesting","interested","interest","interests"],1],
    ["The news was ___.",["surprising","surprised","surprise","surprisingly"],0],
    ["She felt ___ after the long shift.",["tiring","tired","tire","tiredly"],1],
    ["It was a ___ day. I want to sleep.",["tiring","tired","tire","tires"],0],
    ["We were ___ by the loud noise.",["frightening","frightened","frighten","fright"],1],
    ["The instructions are ___. I do not understand them.",["confusing","confused","confuse","confusion"],0],
    ["I am ___. Can you explain again?",["confusing","confused","confuse","confusion"],1],
    ["The film was very ___.",["exciting","excited","excite","excitedly"],0],
    ["The children are ___ about the trip.",["exciting","excited","excite","excitement"],1]
  ]},
{ id:"g52", lv:3, title:"Past perfect",
  ringkas:"Dipakai untuk kejadian yang sudah selesai sebelum kejadian lain di masa lalu. Bentuknya had + V3 untuk semua subjek.",
  rumus:["Subjek + had + V3: The meeting had started.","Kejadian lebih dulu (past perfect) + kejadian kemudian (simple past): When we arrived, the meeting had started.","Sering dengan before, after, by the time, already, never","Negatif: had not (hadn't) + V3"],
  contoh:[["When we arrived, the meeting had already started.","Ketika kami tiba, rapat sudah dimulai."],["After he had opened the valve, he started the pump.","Setelah membuka katup, dia menyalakan pompa."],["I realized that I had left my ID card at home.","Saya sadar kartu ID saya tertinggal di rumah."]],
  tips:"Bayangkan garis waktu. Kejadian yang paling dulu memakai had + V3. Kalau urutannya sudah jelas dan berurutan, simple past saja cukup.",
  latihan:[
    ["When we arrived, the meeting ___ already started.",["had","has","have","was"],0],
    ["She ___ the report before the manager asked.",["had finished","has finished","finishes","was finish"],0],
    ["I did not eat because I ___ lunch already.",["had had","have","has had","having"],0],
    ["After he ___ the valve, he started the pump.",["had opened","has opened","opens","was open"],0],
    ["The train ___ when I got to the station, so I missed it.",["had left","has left","leaves","is leaving"],0],
    ["They had never ___ such a big turbine before.",["seen","saw","see","seeing"],0],
    ["By the time the fire team came, the workers ___ the fire.",["had put out","have put out","put outs","are putting out"],0],
    ["He was tired because he ___ all night.",["had worked","has worked","works","is working"],0],
    ["___ you checked the oil before you started the engine?",["Had","Has","Was","Does"],0],
    ["I realized that I ___ my ID card at home.",["had left","have left","leave","am leaving"],0]
  ]},
{ id:"g53", lv:3, title:"Present perfect continuous",
  ringkas:"Dipakai untuk kegiatan yang dimulai di masa lalu dan masih berlangsung sampai sekarang, dengan penekanan pada lamanya.",
  rumus:["I / you / we / they + have been + V-ing","He / she / it + has been + V-ing","Dengan for (lamanya) dan since (titik awal): I have been waiting for two hours.","Tanya: How long have you been + V-ing?"],
  contoh:[["I have been waiting for two hours.","Saya sudah menunggu selama dua jam."],["The unit has been running since Monday.","Unit itu sudah berjalan sejak Senin."],["How long have you been learning English?","Sudah berapa lama kamu belajar bahasa Inggris?"]],
  tips:"Kata kerja keadaan (know, like, have dalam arti punya) tidak dipakai dalam bentuk continuous. Salah: I have been knowing him for years. Benar: I have known him for years.",
  latihan:[
    ["I ___ for two hours.",["have been waiting","am waiting","wait","was waited"],0],
    ["She ___ here since 2020.",["has been working","is working","works","have been working"],0],
    ["How long ___ you been learning English?",["have","has","are","do"],0],
    ["It ___ raining all day.",["has been","have been","is been","was been"],0],
    ["They have been ___ the pump since morning.",["repairing","repaired","repair","repairs"],0],
    ["He is tired because he ___ all night.",["has been working","is work","works","have been working"],0],
    ["We have been ___ for the bus for 30 minutes.",["waiting","waited","wait","waits"],0],
    ["How long has she ___ studying?",["been","be","being","was"],0],
    ["The unit has been ___ at full load since Monday.",["running","ran","runs","to run"],0],
    ["I have been ___ this book for a week.",["reading","reads","to read","readed"],0]
  ]},
{ id:"g54", lv:3, title:"Question tags (..., isn't it?)",
  ringkas:"Question tag adalah pertanyaan pendek di akhir kalimat untuk meminta konfirmasi, seperti 'kan?' dalam bahasa Indonesia.",
  rumus:["Kalimat positif + tag negatif: You are an engineer, aren't you?","Kalimat negatif + tag positif: They did not come, did they?","Tag memakai kata bantu yang sama: is / are / was / can / will / have / should","Kalau tidak ada kata bantu, pakai do / does / did: She works here, doesn't she?","Khusus: I am late, aren't I?"],
  contoh:[["It is hot today, isn't it?","Hari ini panas, kan?"],["You will call me, won't you?","Kamu akan menelepon saya, kan?"],["He can't drive, can he?","Dia tidak bisa menyetir, kan?"]],
  tips:"Bahasa Inggris tidak punya satu kata seperti 'kan' untuk semua kalimat. Tag harus menyesuaikan kata bantu dan subjeknya.",
  latihan:[
    ["You are an engineer, ___?",["aren't you","are you","don't you","isn't it"],0],
    ["She works here, ___?",["doesn't she","does she","isn't she","don't she"],0],
    ["They did not come, ___?",["did they","didn't they","do they","were they"],0],
    ["It is hot today, ___?",["isn't it","is it","doesn't it","aren't it"],0],
    ["He can drive, ___?",["can't he","can he","doesn't he","isn't he"],0],
    ["You have finished, ___?",["haven't you","have you","don't you","didn't you"],0],
    ["We should stop now, ___?",["shouldn't we","should we","don't we","aren't we"],0],
    ["The pump was not running, ___?",["was it","wasn't it","did it","is it"],0],
    ["You will call me, ___?",["won't you","will you","don't you","aren't you"],0],
    ["I am late, ___?",["aren't I","am I","amn't I","don't I"],0]
  ]},
{ id:"g55", lv:3, title:"Causative: have / get something done",
  ringkas:"Dipakai ketika kita meminta atau membayar orang lain untuk mengerjakan sesuatu. Kita tidak mengerjakannya sendiri.",
  rumus:["have / get + benda + V3: I had my car repaired. (mobil saya diperbaiki orang)","have + orang + V1: I had the technician fix the motor.","get + orang + to V1: I got the technician to fix the motor.","Bisa di semua tense: We are having the office painted. We will get it checked."],
  contoh:[["We had the valve replaced last week.","Katupnya kami minta diganti minggu lalu."],["You should get your eyes tested.","Sebaiknya kamu periksakan matamu."],["She had the technician fix the motor.","Dia meminta teknisi memperbaiki motornya."]],
  tips:"Bandingkan: I repaired my car (saya sendiri yang memperbaiki) dan I had my car repaired (orang lain yang memperbaiki). Perhatikan juga: have + orang + V1, tetapi get + orang + to V1.",
  latihan:[
    ["I had my car ___ yesterday.",["repaired","repair","repairing","to repair"],0],
    ["We need to get the pump ___.",["checked","check","checking","to check"],0],
    ["She had the technician ___ the motor.",["fix","fixed","to fix","fixing"],0],
    ["I got my brother ___ me.",["to help","help","helped","helping"],0],
    ["He has his hair ___ every month.",["cut","cuts","cutting","to cut"],0],
    ["We had the valve ___ last week.",["replaced","replace","replacing","to replace"],0],
    ["The manager had us ___ the report again.",["write","wrote","to write","written"],0],
    ["You should get your eyes ___.",["tested","test","testing","to test"],0],
    ["I will get someone ___ the lamp.",["to change","change","changed","changes"],0],
    ["They are having the office ___ this week.",["painted","paint","painting","to paint"],0]
  ]},
{ id:"g56", lv:3, title:"So do I, neither do I",
  ringkas:"Dipakai untuk mengatakan 'saya juga' atau 'saya juga tidak' dengan singkat. Kata bantunya mengikuti kalimat sebelumnya.",
  rumus:["Setuju dengan kalimat positif: So + kata bantu + subjek. A: I am tired. B: So am I.","Setuju dengan kalimat negatif: Neither + kata bantu + subjek. A: I can't swim. B: Neither can I.","Tanpa kata bantu, pakai do / does / did: A: I like coffee. B: So do I.","Bentuk lain: I do too. / I don't either."],
  contoh:[["A: I am hungry. B: So am I.","A: Saya lapar. B: Saya juga."],["A: I do not smoke. B: Neither do I.","A: Saya tidak merokok. B: Saya juga tidak."],["A: I went home early. B: So did I.","A: Saya pulang cepat. B: Saya juga."]],
  tips:"Setelah neither, kata bantunya positif karena neither sudah negatif. Salah: Neither don't I. Benar: Neither do I.",
  latihan:[
    ["A: I am tired. B: So ___ I.",["am","do","is","did"],0],
    ["A: I like coffee. B: So ___ I.",["do","am","did","have"],0],
    ["A: I do not smoke. B: Neither ___ I.",["do","am","did","don't"],0],
    ["A: I went home early. B: So ___ I.",["did","do","was","went"],0],
    ["A: I cannot swim. B: Neither ___ I.",["can","can't","do","am"],0],
    ["A: She has finished. B: So ___ he.",["has","have","does","did"],0],
    ["A: I was not there. B: Neither ___ I.",["was","wasn't","did","am"],0],
    ["A: I will join. B: So ___ I.",["will","do","am","would"],0],
    ["A: I have never been to Bali. B: ___ have I.",["Neither","So","Too","Either"],0],
    ["A: I love durian. B: I do ___.",["too","so","neither","either"],0]
  ]},
{ id:"g57", lv:3, title:"Pertanyaan tidak langsung (indirect questions)",
  ringkas:"Pertanyaan yang diawali Could you tell me, Do you know, atau I wonder terdengar lebih sopan. Urutan kata setelahnya seperti kalimat biasa, bukan kalimat tanya.",
  rumus:["Langsung: Where is the office? Tidak langsung: Could you tell me where the office is?","Tanpa do / does / did: What time does it start? menjadi Do you know what time it starts?","Pertanyaan ya / tidak pakai if atau whether: Do you know if she is coming?","Pembuka: Could you tell me ..., Do you know ..., I wonder ..., I would like to know ..."],
  contoh:[["Could you tell me where the office is?","Bisakah Anda memberi tahu di mana kantornya?"],["Do you know what time the shift starts?","Apakah kamu tahu jam berapa shift mulai?"],["I wonder if he is at home.","Saya ingin tahu apakah dia ada di rumah."]],
  tips:"Kesalahan paling umum adalah tetap memakai urutan tanya. Salah: Could you tell me where is the office? Benar: Could you tell me where the office is?",
  latihan:[
    ["Could you tell me where ___?",["the office is","is the office","does the office","the office does"],0],
    ["Do you know what time ___?",["the shift starts","does the shift start","starts the shift","the shift start"],0],
    ["I wonder why ___ late.",["he is","is he","does he","he does"],0],
    ["Can you tell me how much ___?",["it costs","does it cost","costs it","it cost"],0],
    ["Do you know ___ she is coming?",["if","what","that if","does"],0],
    ["Could you tell me where ___ yesterday?",["you went","did you go","went you","you did went"],0],
    ["I do not know who ___.",["he is","is he","does he","he does"],0],
    ["Can you explain how ___?",["this pump works","does this pump work","works this pump","this pump work"],0],
    ["Do you know when ___ back?",["they will come","will they come","they come will","do they come"],0],
    ["I would like to know ___ the report is ready.",["whether","what","which","who"],0]
  ]},
{ id:"g58", lv:4, title:"Modal perfect: should have, must have, could have",
  ringkas:"Modal + have + V3 dipakai untuk membicarakan masa lalu: penyesalan, kritik, kesimpulan, atau kemungkinan yang tidak terjadi.",
  rumus:["should have + V3 = seharusnya (tetapi tidak dilakukan): You should have told me.","should not have + V3 = seharusnya tidak (tetapi dilakukan)","must have + V3 = pasti sudah (kesimpulan yakin): It must have rained.","can't have + V3 = tidak mungkin sudah: He can't have left.","could have + V3 = sebenarnya bisa (tetapi tidak terjadi). might have + V3 = mungkin sudah"],
  contoh:[["You should have checked the valve.","Seharusnya kamu memeriksa katupnya."],["The ground is wet. It must have rained.","Tanahnya basah. Pasti tadi hujan."],["We could have won the tender.","Sebenarnya kami bisa memenangkan tender itu."]],
  tips:"Setelah modal selalu have, tidak pernah has atau had. Salah: He should has come. Benar: He should have come.",
  latihan:[
    ["You ___ have told me earlier. Now it is too late.",["should","must","can","will"],0],
    ["The ground is wet. It ___ have rained last night.",["must","should","can't","would"],0],
    ["He ___ have left. His car is still here.",["can't","must","should","will"],0],
    ["I should have ___ the valve.",["checked","check","checking","to check"],0],
    ["We ___ have won, but we made too many mistakes.",["could","must","can't","will"],0],
    ["She is not here. She ___ have missed the bus.",["might","should","can","will"],0],
    ["You should not have ___ the alarm.",["ignored","ignore","ignoring","ignores"],0],
    ["They ___ have finished by now. Let us check.",["must","can","will not","did"],0],
    ["I ___ have called you, but I forgot.",["should","must","can't","might not"],0],
    ["It was a mistake. We ___ have started the pump without checking.",["should not","must","could","might"],0]
  ]},
{ id:"g59", lv:4, title:"Unless, as long as, provided, in case",
  ringkas:"Selain if, ada beberapa kata penghubung syarat yang artinya lebih spesifik.",
  rumus:["unless = kecuali jika / jika tidak: You cannot enter unless you have a permit.","as long as / provided (that) = asalkan: You can go provided that you finish the job.","in case = untuk berjaga-jaga kalau: Take an umbrella in case it rains.","Setelah kata-kata ini pakai present tense untuk masa depan, bukan will"],
  contoh:[["Unless you hurry, you will miss the bus.","Kalau kamu tidak buru-buru, kamu akan ketinggalan bus."],["I will help you as long as you tell me the truth.","Saya akan membantumu asalkan kamu jujur."],["Write it down in case you forget.","Catat untuk berjaga-jaga kalau kamu lupa."]],
  tips:"Unless sudah bermakna negatif, jadi jangan ditambah not. Unless you hurry sama dengan if you do not hurry. In case bukan sinonim if: in case dipakai untuk persiapan sebelum sesuatu terjadi.",
  latihan:[
    ["You cannot enter ___ you have a permit.",["unless","if","provided","in case"],0],
    ["I will help you ___ you tell me the truth.",["as long as","unless","in case","although"],0],
    ["Take an umbrella ___ it rains.",["in case","unless","as long as","provided"],0],
    ["___ you hurry, you will miss the bus.",["Unless","If","Provided","In case"],0],
    ["You can borrow the car ___ that you return it by six.",["provided","unless","in case","although"],0],
    ["The alarm will not stop ___ someone resets it.",["unless","if","in case","as long"],0],
    ["Write it down ___ you forget.",["in case","unless","provided","so long"],0],
    ["We will start on time ___ everyone is ready.",["as long as","unless","in case","though"],0],
    ["___ the pressure drops, do not open the valve.",["Unless","Provided","In case of","As long"],0],
    ["Keep a spare key ___ you lose the first one.",["in case","unless","provided that if","as long"],0]
  ]},
{ id:"g60", lv:4, title:"Participle clauses",
  ringkas:"Klausa dengan V-ing atau V3 dipakai untuk memadatkan kalimat. V-ing bermakna aktif, V3 bermakna pasif.",
  rumus:["V-ing (aktif): The man standing near the gate is my boss. (= who is standing)","V3 (pasif): The pump installed last week works well. (= which was installed)","Having + V3 = setelah selesai: Having finished the report, she went home.","Subjek kedua klausa harus sama"],
  contoh:[["People living near the plant often hear noise.","Orang yang tinggal dekat pembangkit sering mendengar kebisingan."],["The data presented in the table show a clear trend.","Data yang disajikan di tabel menunjukkan tren yang jelas."],["Having read the instructions, he started the machine.","Setelah membaca instruksinya, dia menyalakan mesin."]],
  tips:"Tanyakan: subjeknya melakukan (V-ing) atau dikenai (V3)? The workers injured in the accident = pekerja yang terluka (dikenai), jadi V3.",
  latihan:[
    ["___ the report, she went home.",["Having finished","Finished","Finish","To finishing"],0],
    ["The man ___ near the gate is my boss.",["standing","stood","stands","stand"],0],
    ["The pump ___ last week is working well.",["installed","installing","installs","install"],0],
    ["___ tired, he went to bed early.",["Feeling","Felt","Feel","To feeling"],0],
    ["The workers ___ in the accident were taken to hospital.",["injured","injuring","injure","injures"],0],
    ["___ from a distance, the plant looks small.",["Seen","Seeing","See","Saw"],0],
    ["People ___ near the plant often hear noise.",["living","lived","live","lives"],0],
    ["___ the instructions, he started the machine.",["Having read","Read have","Reads","Being reading"],0],
    ["The data ___ in the table show a clear trend.",["presented","presenting","present","presents"],0],
    ["Not ___ what to do, I called my supervisor.",["knowing","known","know","knew"],0]
  ]},
{ id:"g61", lv:4, title:"Future continuous dan future perfect",
  ringkas:"Future continuous untuk kegiatan yang sedang berlangsung pada suatu saat di masa depan. Future perfect untuk kegiatan yang sudah selesai sebelum suatu saat di masa depan.",
  rumus:["Future continuous: will be + V-ing. This time tomorrow, I will be flying to Jakarta.","Future perfect: will have + V3. By Friday, we will have finished the report.","Kata kunci continuous: at 10 tomorrow, this time next week","Kata kunci perfect: by + waktu, by the time + klausa"],
  contoh:[["Do not call at eight. We will be having dinner.","Jangan telepon jam delapan. Kami sedang makan malam."],["By 2030, the plant will have operated for twenty years.","Pada 2030, pembangkit itu sudah beroperasi dua puluh tahun."],["By the time you arrive, the meeting will have started.","Saat kamu tiba, rapat sudah dimulai."]],
  tips:"Kata by (paling lambat) hampir selalu menandakan future perfect. Setelah by the time pakai present tense: By the time you arrive (bukan will arrive).",
  latihan:[
    ["This time tomorrow, I ___ to Jakarta.",["will be flying","will have flown","fly","am flown"],0],
    ["By Friday, we ___ the report.",["will have finished","will be finishing","finish","are finished"],0],
    ["By 2030, the plant ___ for twenty years.",["will have operated","will be operate","operates","is operating"],0],
    ["Do not call at 8. We ___ dinner.",["will be having","will have had","have had","had"],0],
    ["By the time you arrive, the meeting ___.",["will have started","will be start","started","has start"],0],
    ["At midnight tonight, the team ___ the boiler.",["will be inspecting","will have inspect","inspected","inspects"],0],
    ["By next month, she ___ here for ten years.",["will have worked","will be work","works","is working"],0],
    ["This time next week, we ___ on the beach.",["will be lying","will have lain","lie","lay"],0],
    ["By tomorrow morning, the tank ___.",["will have cooled","will be cool down","cools","cooled"],0],
    ["Will you ___ the car tonight? I want to borrow it.",["be using","have used","been using","using"],0]
  ]},
{ id:"g62", lv:4, title:"Penekanan: It is ... that, What ... is",
  ringkas:"Cleft sentence memecah kalimat untuk menonjolkan satu bagian. Berguna di laporan dan presentasi ketika kamu ingin menegaskan penyebab atau hal terpenting.",
  rumus:["It is / was + bagian yang ditekankan + that ...: It was the valve that caused the leak.","Untuk orang boleh who: It was Budi who found the problem.","What + klausa + is / was ...: What I need is more time.","The thing that ... is ...: The thing that worries me is the cost.","All (that) + klausa + is ...: All we need is one more day."],
  contoh:[["It was the sensor that failed first.","Sensorlah yang rusak lebih dulu."],["What we need is a clear plan.","Yang kami butuhkan adalah rencana yang jelas."],["It is safety that matters most.","Keselamatanlah yang paling penting."]],
  tips:"Setelah It is ... pakai that, bukan what. Salah: It was the valve what caused the leak. What dipakai di awal: What caused the leak was the valve.",
  latihan:[
    ["It was the valve ___ caused the leak.",["that","what","it","where"],0],
    ["___ I need is more time.",["What","That","It","Which"],0],
    ["It ___ Budi who found the problem.",["was","were","has","did"],0],
    ["What we want ___ a clear answer.",["is","are","be","does"],0],
    ["It is safety ___ matters most.",["that","what","who is","when"],0],
    ["___ was the noise that woke me up.",["It","What","That","There"],0],
    ["What surprised me ___ the cost.",["was","were","is being","did"],0],
    ["It was in 2019 ___ the unit was built.",["that","what","which year","then"],0],
    ["The thing ___ I like most is the teamwork.",["that","what","who","it"],0],
    ["All ___ need is one more day.",["we","what we","that what","us"],0]
  ]},
{ id:"g63", lv:5, title:"Artikel untuk tulisan akademik",
  ringkas:"Kesalahan artikel sangat sering menurunkan skor grammar IELTS. Kuncinya adalah membedakan pernyataan umum dan hal yang spesifik.",
  rumus:["Pernyataan umum dengan benda jamak atau tak terhitung: tanpa artikel. Pollution is a problem. Children need care.","the + hal spesifik atau sudah jelas: the pollution in Jakarta, the government","the + superlatif dan urutan: the most important, the first","the + adjektiva = kelompok orang: the elderly, the poor, the unemployed","the + dekade: in the 1990s. a / an + benda tunggal yang baru disebut"],
  contoh:[["Education is the key to development.","Pendidikan adalah kunci pembangunan."],["The elderly need better healthcare.","Kaum lansia butuh layanan kesehatan lebih baik."],["Unemployment causes poverty.","Pengangguran menyebabkan kemiskinan."]],
  tips:"Jangan menaruh the di depan konsep umum. Salah: The technology has changed the society. Benar: Technology has changed society.",
  latihan:[
    ["___ pollution is a serious problem in big cities.",["(tanpa artikel)","A","The","An"],0],
    ["___ elderly need better healthcare.",["The","A","An","(tanpa artikel)"],0],
    ["Education is ___ most important factor.",["the","a","an","(tanpa artikel)"],0],
    ["Many people move to cities to find ___ work.",["(tanpa artikel)","a","an","these"],0],
    ["___ government should invest in public transport.",["The","A","An","(tanpa artikel)"],0],
    ["She wants to become ___ engineer.",["an","a","the","(tanpa artikel)"],0],
    ["___ children learn languages quickly.",["(tanpa artikel)","A","An","Every"],0],
    ["The number of cars rose in ___ 1990s.",["the","a","an","(tanpa artikel)"],0],
    ["There is ___ serious problem with this plan.",["a","an","the","(tanpa artikel)"],0],
    ["___ unemployment causes poverty.",["(tanpa artikel)","An","A","Many"],0]
  ]},
{ id:"g64", lv:5, title:"Subject-verb agreement yang menjebak",
  ringkas:"Kata kerja harus cocok dengan subjek intinya, bukan dengan kata benda terdekat. Beberapa subjek terlihat jamak tetapi sebenarnya tunggal.",
  rumus:["each, every, everyone, nobody + kata kerja tunggal: Everyone wants to succeed.","one of the + jamak + kata kerja tunggal: One of the problems is traffic.","Subjek inti menentukan: The quality of the products has improved.","Tunggal walau berakhiran s: news, statistics (ilmu), economics, mathematics","Jamak: people, police. Jarak, waktu, uang sebagai satu kesatuan: tunggal","neither ... nor: kata kerja mengikuti subjek terdekat"],
  contoh:[["One of the main causes is poverty.","Salah satu penyebab utamanya adalah kemiskinan."],["The quality of the roads has improved.","Kualitas jalan sudah membaik."],["The police are investigating the case.","Polisi sedang menyelidiki kasus itu."]],

{ id:"s25", lv:5, title:"The Rise of Online Learning",
  text:"Online learning has expanded rapidly over the past decade. In 2012, only a small number of universities offered full degrees online; today, most major institutions do. Supporters claim that online courses widen access to education, particularly for people who live far from a campus or who work full-time. Costs are also lower, since students do not need to pay for accommodation or travel. However, completion rates remain a concern. One study of large open courses found that fewer than 10 percent of those who enrolled actually finished. Researchers suggest that many learners lack the self-discipline to study alone and miss the support of classmates. To address this, some providers now combine recorded lectures with live discussion groups and personal tutors. Early evidence indicates that these blended courses achieve considerably higher completion rates, although they are more expensive to run.",

{ id:"s26", lv:5, title:"Why Bees Matter",
  text:"Bees play a crucial role in food production. Around a third of the crops that humans eat, including apples, almonds and coffee, depend on pollination by insects, and bees are the most important of these. In recent decades, however, bee populations have declined in many parts of the world. Scientists have identified several causes, including the loss of wild flowers, the use of certain pesticides, and diseases spread by parasites. Climate change may also be a factor, as warmer winters disturb the bees' natural cycle. The consequences could be serious: without bees, some farmers would have to pollinate crops by hand, which is slow and costly. In response, several countries have restricted the most harmful pesticides, and many cities now encourage residents to plant flowers. Whether these measures will be enough to reverse the decline is not yet clear.",

    ["What proportion of human food crops depends on insect pollination?",["About a third","About a half","About a tenth","Almost all"],0],

// ===== KOSAKATA MASSAL =====
// Format per baris: kata|arti|jenis|contoh kalimat|bentuk di contoh (kalau beda)
// Baris "#k" / "#u" / "#a" mengganti kategori (kerja / umum / akademik).
function addWords(lv, txt){
  let cat = "u";
  txt.split("\n").forEach(line => {
    line = line.trim();
    if(!line) return;
    if(line.charAt(0) === "#"){ cat = line.slice(1).trim(); return; }
    const p = line.split("|");
    V[lv].push([p[0], p[1], p[2], p[3], "", cat, p[4] || p[0]]);
  });
}

{ id:"s27", lv:1, title:"A Day at the Power Plant",
  text:"My name is Budi. I work at a power plant near the sea. I am an operator. I start work at seven in the morning, and I finish at three in the afternoon. I take a bus to work. The bus ride takes thirty minutes. Every morning I wear my helmet, my gloves and my safety shoes.\n\nFirst, I go to the control room. I meet the night operator, Rudi. He is tired, but he is always friendly. He tells me about the night. Sometimes there is a problem with a pump. Sometimes everything is fine. Today everything is fine. Then I read the numbers on the screen. I write them in my book.\n\nAt noon I eat lunch in the canteen with my friends. We eat rice, vegetables and fish. Our canteen is clean and the food is good. After lunch, I walk around the plant. I check the pumps and the fans. I listen to the sounds. If I hear a strange sound, I tell my supervisor.\n\nAt three o'clock, the afternoon operator comes. I tell him about my day. Then I go home. At home, I play with my children and I eat dinner with my wife. I like my job because I learn something new every day.",
  q:[
    ["Where does Budi work?",["At a power plant near the sea","At a factory in the city","At an office","At a school"],0],
    ["How does Budi go to work?",["By bus","By car","By motorbike","On foot"],0],
    ["Who is Rudi?",["The night operator","The supervisor","Budi's brother","The canteen cook"],0],
    ["What does Budi do if he hears a strange sound?",["He tells his supervisor","He goes home","He stops the pump","He writes a letter"],0],
    ["Why does Budi like his job?",["He learns something new every day","The pay is very high","The work is easy","He works at night"],0]
  ]},
{ id:"s28", lv:1, title:"My New Neighbour",
  text:"Last week, a new family moved into the house next to mine. The father is a teacher, and the mother is a nurse. They have two children. The boy is ten years old, and the girl is six. The family is from Surabaya, but now they live in our town.\n\nOn Saturday, my wife made a cake. We took the cake to the new house. The mother opened the door. She was very happy. She said, 'Thank you. Please come in.' We sat in the living room and drank tea. The children were shy, but they smiled at us.\n\nThe father asked me about the town. I told him about the market, the park and the bus station. I said the market is open every morning, and the park is good for children. He wrote the names in his phone. He said, 'This is very helpful.'\n\nNow our children play together after school. The boy has a red bicycle, and my son likes it very much. I think we are lucky. A good neighbour is better than a big house.",
  q:[

  ]},
{ id:"s29", lv:1, title:"Lunch in the Canteen",
  text:"The canteen at our plant is not big, but it is always busy at noon. There are ten tables and forty chairs. Mrs Sari cooks the food. She has a small kitchen behind the counter. She starts cooking at five in the morning, so the food is fresh.\n\nToday there are three dishes. The first is chicken with rice. The second is fried fish with vegetables. The third is noodle soup. A plate of rice costs ten thousand rupiah. A cold drink costs three thousand rupiah. Many workers like the chicken, so it finishes first. If you come late, there is only soup.\n\nI usually sit with my friends, Andi and Dewi. Andi works in the workshop, and Dewi works in the office. We talk about our families and the football match. Sometimes we talk about work, but not much. Lunch is a time to rest.\n\nAfter lunch, we wash our hands and put the plates on the shelf. Mrs Sari says, 'Thank you, see you tomorrow.' I always say, 'The food is delicious, Mrs Sari.' She smiles, and I feel happy.",
  q:[

    ["Where does Dewi work?",["In the office","In the workshop","In the kitchen","In the warehouse"],0],
    ["What happens if you come late to the canteen?",["There is only soup","The canteen is closed","You must cook","The food is free"],0]
  ]},
{ id:"s30", lv:1, title:"A Weekend with My Family",
  text:"On Saturday morning, I woke up at six o'clock. I cleaned the house with my wife. My son washed the motorbike, and my daughter watered the plants. After that, we ate breakfast together. We had eggs, bread and sweet tea.\n\nIn the afternoon, we went to my parents' house. It is in a small village, one hour from our town. We took a bus and then walked for ten minutes. My mother was in the garden. She was very happy to see the children. She gave them mangoes from her tree. My father was in the rice field, so we waited for him.\n\nIn the evening, my father came home. He was tired, but he told many funny stories. We ate dinner on the floor, and we ate a lot. My mother cooked fish soup, and it was very good. The children played outside until it was dark.\n\nOn Sunday, we went back to town. The children were sleepy on the bus. I looked at them and smiled. Family time is the best time. I hope we can visit my parents again next month.",

  ]},
{ id:"s31", lv:2, title:"The Job Interview",
  text:"Yesterday, Rina had a job interview at a big company in Jakarta. She was very nervous because it was her first interview. She woke up early, ironed her white shirt and took a taxi to the office. She arrived thirty minutes early, so she waited in the lobby.\n\nThe manager, Mr Hartono, was kind but serious. He asked her about her studies and her experience. Rina said that she had worked as an assistant at a small workshop for two years. She also said that she was good at using computers and that she could work in a team. Then Mr Hartono asked, 'Why do you want to work here?' Rina answered, 'Because your company trains young engineers, and I want to learn.'\n\nAfter the interview, Mr Hartono showed her the office. She saw the meeting rooms, the library and the small gym for employees. He said that the company would call her within a week. Rina thanked him and left.\n\nOn the way home, Rina felt more relaxed. She did not know if she would get the job, but she was proud of herself. She had answered all the questions clearly. 'Whatever happens, this was a good experience,' she thought. Three days later, the company called her. She was invited to the second interview.",
  q:[
    ["Why was Rina nervous?",["It was her first interview","She was late","She had no experience","The manager was angry"],0],
    ["How long did Rina work at the small workshop?",["Two years","Two months","Ten years","Six months"],0],

    ["What did Mr Hartono say at the end of the interview?",["The company would call her within a week","She had the job","She must come back tomorrow","She should study more"],0],
    ["What happened three days later?",["She was invited to a second interview","She got a rejection letter","She started work","She lost her phone"],0]
  ]},
{ id:"s32", lv:2, title:"A Trip to Bali",
  text:"Last December, my colleagues and I went on a trip to Bali. We planned the trip for two months. Everyone paid a little money every week, so it was not difficult. We booked a small hotel near the beach, and we bought the plane tickets early because they were cheaper.\n\nThe flight was short, only one hour and a half. When we arrived, a driver was waiting at the airport. He took us to the hotel and told us about the island. On the first day, we visited a famous temple. The view was beautiful, but there were too many tourists. We took many photos and bought some small gifts for our families.\n\nOn the second day, we were going to swim in the sea, but it rained all morning. So we stayed in the hotel and played cards. In the afternoon, the sun came out, and we walked along the beach. We ate fresh seafood for dinner. It was the best meal of the trip, and it was not expensive.\n\nOn the last day, we went to a traditional market. I bought a wooden mask for my brother. We were sad to leave, but we promised to come back. When we got home, everybody was tired but happy. Our manager said, 'We should do this again next year.'",
  q:[
    ["How did the group pay for the trip?",["Everyone paid a little money every week","The company paid everything","They borrowed money","They sold their phones"],0],
    ["Why did they buy the plane tickets early?",["They were cheaper","The flight was full","The manager told them","The hotel asked them"],0],
    ["What did they do on the first day?",["They visited a famous temple","They swam in the sea","They played cards","They went to the market"],0],
    ["Why did they stay in the hotel on the second morning?",["It rained","They were tired","The sea was closed","They had a meeting"],0],
    ["What did the writer buy for his brother?",["A wooden mask","A shirt","A bag of coffee","A picture"],0]
  ]},
{ id:"s33", lv:2, title:"Moving to a New City",
  text:"When Dedi was offered a job in Balikpapan, he was both excited and worried. He had lived in Bandung all his life. His friends, his family and his favourite restaurants were all there. But the job was a good opportunity, and the salary was much higher than before. After talking to his wife for a week, he decided to accept it.\n\nThe first month was difficult. The weather was hotter, and the traffic was different. He did not know any roads, so he got lost twice on the way to work. His colleagues were friendly, but they spoke quickly, and he could not understand everything. In the evening, he often felt lonely, so he called his wife and children, who were still in Bandung.\n\nThings changed slowly. His colleagues invited him to play badminton every Thursday. He found a small restaurant that served a soup that he loved. After three months, his family moved to Balikpapan as well. His daughter found a new school, and his wife started to teach English at a language centre.\n\nNow, a year later, Dedi says that the move was one of the best decisions in his life. 'At first I was afraid,' he says, 'but a new place gives you new friends and new skills. I am not afraid of change anymore.'",
  q:[
    ["Why did Dedi accept the job?",["It was a good opportunity with a higher salary","His wife wanted a new house","He did not like Bandung","His friends lived in Balikpapan"],0],
    ["What was difficult in the first month?",["The weather, the traffic and the roads","The salary","The food","The children's school"],0],
    ["What does Dedi do every Thursday?",["He plays badminton with colleagues","He visits his family","He cooks soup","He studies English"],0],
    ["What does Dedi's wife do in Balikpapan?",["She teaches English","She sells soup","She is a nurse","She works at a bank"],0],
    ["How does Dedi feel about the move now?",["It was one of his best decisions","He regrets it","He wants to go back","He is still lonely"],0]
  ]},
{ id:"s34", lv:2, title:"The Flood",
  text:"In January, it rained for five days without stopping. On the fifth night, the river near our village rose quickly. At about eleven o'clock, the water entered the first houses. The village head hit a drum to wake everybody up, and people started to move to the school, which is on higher ground.\n\nI was asleep when I heard the drum. My wife took the children, and I took the important papers and a bag of clothes. The water was already up to my knees when we left. It was dark and cold, and a lot of people were crying. Young men helped old people to walk, and some carried bags of rice from the neighbours' houses.\n\nAt the school, volunteers gave us blankets and hot tea. A doctor checked the babies and the sick. By morning, more than three hundred people were in the school. The rain finally stopped at six o'clock, but the water did not go down for two days. When we went back home, there was mud everywhere. We lost our furniture, but nobody in our family was hurt.\n\nAfter the flood, the villagers worked together to clean the streets. The government sent food and tools. I learned that in a disaster, a calm mind and a good neighbour are more valuable than anything else.",
  q:[
    ["How long did it rain before the flood?",["Five days","One night","Two weeks","Three hours"],0],
    ["How did the village head wake everybody up?",["He hit a drum","He shouted on the phone","He rang a bell","He sent a message"],0],
    ["Where did the people go?",["To the school","To the mosque","To the hospital","To another village"],0],
    ["What did the volunteers give to the people?",["Blankets and hot tea","Money","New houses","Boats"],0],
    ["What did the writer lose?",["Furniture","His children","His job","His important papers"],0]
  ]},
{ id:"s35", lv:3, title:"Planning the Annual Maintenance",
  text:"Every year, the power plant stops one unit for about three weeks so that the maintenance team can inspect and repair the main equipment. This is called the annual outage. Although it is expensive and reduces the amount of electricity that the plant can sell, it is necessary because small problems can become serious failures if they are not found early.\n\nPlanning begins six months before the outage. First, the engineers review the records of the equipment and make a list of jobs. The most important jobs are the inspection of the turbine, the cleaning of the boiler tubes and the replacement of worn bearings. Then the planners estimate how many people and how much time each job needs. Spare parts must be ordered early, because some of them take three months to arrive from overseas.\n\nDuring the outage, about four hundred contractors work at the site together with the plant's own employees. This makes safety a major concern. Every worker must attend a safety induction, and every job needs a permit. The supervisors hold a short meeting every morning to discuss the jobs of the day and the risks. If a job is delayed, the planner has to change the schedule so that the unit can restart on time.\n\nAfter the unit has been restarted and is running normally, the team writes a report. The report describes what was done, what was found and what should be improved next year. Many managers believe that this report is as important as the repair itself, because it helps the next team to avoid the same mistakes.",
  q:[
    ["How long is the annual outage?",["About three weeks","About three months","About three days","About one year"],0],
    ["Why must spare parts be ordered early?",["Some take three months to arrive","The factory is closed","They are very cheap","The contractors need them first"],0],
    ["How many contractors work during the outage?",["About four hundred","About forty","About four thousand","About fourteen"],0],
    ["What happens at the daily morning meeting?",["The jobs and risks of the day are discussed","The report is written","Permits are cancelled","Spare parts are counted"],0],
    ["Why is the final report important?",["It helps the next team avoid the same mistakes","It is required by the contractors","It reduces the cost of spare parts","It replaces the permits"],0]
  ]},
{ id:"s36", lv:3, title:"A Quiet Hero in the Control Room",
  text:"Wati has worked as a control room operator for eleven years. She is usually the first person to notice that something is wrong, even though she rarely sits in the same place for long. Her colleagues joke that she can hear a problem before the alarm does. In fact, her skill comes from careful observation and from a habit that she developed in her first year.\n\nEvery shift, Wati compares the numbers on the screen with the numbers of the previous shift. She believes that a sudden change is not the only warning sign. Sometimes a value moves very slowly, and nobody pays attention until it becomes a problem. Last March, she noticed that the temperature of a bearing had risen by only two degrees in three days. Although it was still within the limit, she asked the maintenance team to check it.\n\nThe technicians found that the oil was contaminated. If the pump had continued to run for another week, the bearing might have failed, and the unit would have stopped for several days. Thanks to her report, the repair took only four hours and cost very little.\n\nWhen the manager thanked her at a meeting, Wati looked embarrassed. 'I only did my job,' she said. 'But if you ask me for advice, I would say this: never ignore a small change just because it is small.' Since then, the plant has added a short trend review to every shift handover.",
  q:[
    ["How long has Wati worked as an operator?",["Eleven years","One year","Five years","Twenty years"],0],
    ["What does Wati do every shift?",["She compares the numbers with the previous shift","She repairs pumps","She trains new operators","She writes the schedule"],0],
    ["What did Wati notice last March?",["A bearing temperature rose slowly","A pump stopped suddenly","An alarm was broken","The oil was missing"],0],
    ["What did the technicians find?",["Contaminated oil","A broken cable","A loose bolt","A leaking pipe"],0],
    ["What has the plant added to every shift handover?",["A short trend review","A new alarm","An extra operator","A weekly meeting"],0]
  ]},
{ id:"s37", lv:3, title:"Learning English at Work",
  text:"When the company announced that all supervisors must be able to communicate in English, Agus felt anxious. He had studied English at school, but he had not used it for fifteen years. He could read a manual if he used a dictionary, but speaking to a foreigner seemed impossible. Nevertheless, he knew that the company would send him to a training course at the head office if he did not improve.\n\nInstead of waiting, he made a plan. First, he decided to study for twenty minutes every day, even on busy days. He downloaded an application on his phone and learned five new words each morning. Then he began to listen to short English reports while he was riding the bus. At the beginning he understood almost nothing, but after a month he could follow the general idea.\n\nThe biggest challenge was speaking. Agus was afraid of making mistakes, so he asked a colleague, Maya, to practise with him during lunch. They agreed that they would speak only English for the first fifteen minutes. At first it was funny and embarrassing, but gradually it became natural.\n\nSix months later, a group of engineers from Japan visited the plant. Agus guided them around the site and explained the safety rules. He made some mistakes, but they understood him. 'The mistakes are not the problem,' he said afterwards. 'The problem is staying silent. If I had waited until my English was perfect, I would never have started.'",
  q:[
    ["Why did Agus feel anxious?",["All supervisors must speak English","He lost his job","He had to move abroad","His boss was foreign"],0],
    ["What did Agus do every morning?",["He learned five new words","He wrote a report","He called Maya","He read a manual"],0],
    ["What did Agus and Maya agree to do at lunch?",["Speak only English for fifteen minutes","Study grammar for an hour","Watch a film","Read the manual aloud"],0],
    ["Who visited the plant six months later?",["Engineers from Japan","Managers from the head office","Students from a school","Inspectors from the government"],0],
    ["What does Agus think is the real problem?",["Staying silent","Making mistakes","Having a poor memory","Using a dictionary"],0]
  ]},
{ id:"s38", lv:3, title:"Choosing a Contractor",
  text:"The plant needs a contractor to paint the cooling tower and to repair the concrete at its base. Three companies sent offers, and the procurement team had to choose one of them. At first glance, the decision looked easy: Company A offered the lowest price, which was almost twenty per cent lower than the others.\n\nHowever, the engineers wanted to look more carefully before making a decision. They visited the sites where Company A had recently worked and talked to the clients. Two of them said that the work was finished late and that the quality of the paint was poor. In addition, Company A had no safety officer on site, and one of its workers had been injured last year. Company B was more expensive, but it had a strong safety record and an experienced team. Company C had the best technology, but it could not start before September, which was too late.\n\nThe procurement manager made a table to compare the offers. The table included price, experience, safety record, schedule and quality of references. Each item received a score from one to five, and some items, such as safety, counted double. The result was clear. Company B had the highest total score, although it was not the cheapest.\n\nIn the end, the plant chose Company B. The manager explained to the director that the lowest price is not always the lowest cost. A delay, a poor repair or an accident could cost much more than the difference in price.",
  q:[
    ["What does the plant need the contractor to do?",["Paint the cooling tower and repair concrete","Build a new boiler","Clean the canteen","Install new computers"],0],
    ["Why did Company A look attractive at first?",["It offered the lowest price","It had the best technology","It could start immediately","It had a safety officer"],0],
    ["What was the problem with Company C?",["It could not start before September","Its price was too low","It had no experience","It had a bad safety record"],0],
    ["How were the offers compared?",["Using a table with scores","By asking the director","By drawing lots","By choosing the oldest company"],0],
    ["What lesson does the manager give?",["The lowest price is not always the lowest cost","Always choose the newest company","Never use contractors","Safety is less important than price"],0]
  ]},
{ id:"s39", lv:3, title:"A Day Without Electricity",
  text:"Last Sunday, a fault in the grid caused a blackout in our district. It started at nine in the morning and lasted almost eight hours. At first, my family did not mind. It was the weekend, and we thought that the power would return in an hour or two. But as time passed, we realised how much we depend on electricity.\n\nThe water pump stopped, so we had no water in the bathroom. The refrigerator warmed up, and my wife worried about the fish and the milk. My children could not play video games or watch television, so they became bored and noisy. My phone battery was low, and I could not charge it. Without the internet, I could not even check when the power would come back.\n\nAround noon, I suggested that we should do something different. We opened the windows, took out the old board games and played them on the floor. Later, we walked to the neighbour's house and shared our food with them before it spoiled. We cooked on a small gas stove and ate together in the garden. It was surprisingly pleasant. People who usually stayed inside came out and talked.\n\nWhen the lights finally came on at five, the children cheered. But my youngest son said, 'Can we do that again?' I laughed, though I understood what he meant. Technology makes life convenient, but it can also keep us apart.",
  q:[
    ["How long did the blackout last?",["Almost eight hours","About one hour","Two days","Half an hour"],0],
    ["What caused the blackout?",["A fault in the grid","A storm","A fire at the plant","A strike by workers"],0],
    ["What did the writer's wife worry about?",["The fish and the milk","The children's homework","The phone battery","The water bill"],0],
    ["What did the family do around noon?",["They played board games","They went shopping","They slept","They repaired the pump"],0],
    ["What did the youngest son say at the end?",["He asked if they could do it again","He was angry","He wanted a new television","He was afraid of the dark"],0]
  ]}
);
